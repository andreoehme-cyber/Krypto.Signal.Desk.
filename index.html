<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SignalDesk · Float-Screener</title>
<style>
:root{
  --bg:#13151a; --surface:#1b1e25; --surface2:#22262e; --text:#e7e9ee;
  --muted:#9aa0a8; --hint:#6f747c; --border:rgba(255,255,255,0.08);
  --border2:rgba(255,255,255,0.05); --accent:#5b8def;
  --pos:#3ec07a; --neg:#e35b5a;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  padding:20px 14px;line-height:1.5}
.wrap{max-width:760px;margin:0 auto}
.title{font-size:18px;font-weight:600;margin:0}
.subtitle{font-size:13px;color:var(--muted);margin:2px 0 16px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{font-size:12px;padding:4px 10px;border-radius:999px;border:0.5px solid var(--border);
  background:var(--surface);color:var(--muted)}
.chip.on{background:rgba(91,141,239,0.16);color:#9cbcff;border-color:rgba(91,141,239,0.4)}
.card{border:0.5px solid var(--border);border-radius:12px;background:var(--surface)}
.scr{width:100%;border-collapse:collapse;font-size:13px}
.scr th{font-weight:500;color:var(--hint);text-align:right;padding:9px 10px;font-size:11px;
  border-bottom:0.5px solid var(--border)}
.scr th:first-child,.scr td.sym{text-align:left}
.scr td{padding:10px;text-align:right;border-bottom:0.5px solid var(--border2)}
.row{cursor:pointer}
.row:hover{background:var(--surface2)}
.row.open{background:var(--surface2)}
.sym{font-weight:600;white-space:nowrap}
.chev{display:inline-block;margin-right:7px;color:var(--muted);transition:transform .15s;font-size:11px}
.pos{color:var(--pos)} .neg{color:var(--neg)} .mut{color:var(--muted)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%}
.zhi{background:rgba(227,91,90,0.18);color:#f08f8e;border-radius:4px;padding:1px 6px}
.zmid{background:rgba(239,159,39,0.18);color:#f0b65f;border-radius:4px;padding:1px 6px}
.detail td{padding:0}
.detailwrap{padding:14px 14px 16px}
.dhead{font-size:13px;color:var(--text);margin-bottom:8px;font-weight:500}
.range{color:var(--hint);font-weight:400;font-size:12px}
.legend{display:flex;flex-wrap:wrap;gap:16px;font-size:12px;color:var(--muted);margin-top:8px}
.legend span{display:flex;align-items:center;gap:6px}
.sw{display:inline-block;width:11px;height:11px;border-radius:3px;opacity:.75}
.ln{display:inline-block;width:14px;height:3px;border-radius:2px}
.info{position:relative;display:inline-flex;align-items:center;justify-content:center;
  width:15px;height:15px;border-radius:50%;background:rgba(239,159,39,0.22);color:#f0b65f;
  font-size:10px;font-weight:700;cursor:help;vertical-align:middle;margin-left:5px}
.info:focus{outline:none}
.tip{visibility:hidden;opacity:0;position:absolute;bottom:155%;left:0;width:230px;
  background:var(--surface2);color:var(--text);border:0.5px solid var(--border);border-radius:8px;
  padding:8px 10px;font-size:12px;font-weight:400;line-height:1.45;z-index:30;
  transition:opacity .12s;box-shadow:0 6px 22px rgba(0,0,0,0.4)}
.info:hover .tip,.info:focus .tip{visibility:visible;opacity:1}
@media(max-width:560px){ .c-bs,.c-fund{display:none} }
@media(max-width:430px){ .c-volz{display:none} }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script type="text/babel">
const {useState} = React;

const COINS = [
  {sym:'BONK',     price:'$0.0000301', d1h:21.4, volZ:6.8, bs:2.4, float:78,  funding:0.09,  flag:'red',   profile:'rave'},
  {sym:'NEIRO',    price:'$0.0013',    d1h:33.4, volZ:8.1, bs:3.0, float:54,  funding:0.13,  flag:'red',   profile:'rave'},
  {sym:'TURBO',    price:'$0.0072',    d1h:28.9, volZ:7.4, bs:2.7, float:66,  funding:0.11,  flag:'red',   profile:'rave'},
  {sym:'MOG',      price:'$0.0000019', d1h:18.2, volZ:6.1, bs:2.3, float:69,  funding:0.08,  flag:'red',   profile:'rave'},
  {sym:'POPCAT',   price:'$1.02',      d1h:15.3, volZ:5.8, bs:2.2, float:84,  funding:0.07,  flag:'red',   profile:'rave'},
  {sym:'FLOKI',    price:'$0.000165',  d1h:12.7, volZ:5.3, bs:2.1, float:71,  funding:0.06,  flag:'red',   profile:'rising'},
  {sym:'BOME',     price:'$0.0094',    d1h:11.1, volZ:4.9, bs:2.0, float:77,  funding:0.05,  flag:'amber', profile:'rising'},
  {sym:'PNUT',     price:'$0.62',      d1h:9.8,  volZ:4.4, bs:1.9, float:73,  funding:0.05,  flag:'amber', profile:'fade'},
  {sym:'WIF',      price:'$2.14',      d1h:8.2,  volZ:4.1, bs:1.8, float:92,  funding:0.04,  flag:'amber', profile:'rising'},
  {sym:'SLERF',    price:'$0.18',      d1h:7.3,  volZ:3.8, bs:1.7, float:79,  funding:0.04,  flag:'amber', profile:'accum'},
  {sym:'MEW',      price:'$0.0091',    d1h:6.4,  volZ:3.6, bs:1.6, float:88,  funding:0.03,  flag:'amber', profile:'rising'},
  {sym:'SPX',      price:'$1.34',      d1h:5.5,  volZ:3.2, bs:1.5, float:95,  funding:0.02,  flag:'amber', profile:'rising'},
  {sym:'FARTCOIN', price:'$1.21',      d1h:4.2,  volZ:2.4, bs:1.4, float:91,  funding:0.02,  flag:'green', profile:'rising'},
  {sym:'BRETT',    price:'$0.118',     d1h:3.1,  volZ:2.1, bs:1.3, float:90,  funding:0.02,  flag:'green', profile:'rising'},
  {sym:'GIGA',     price:'$0.041',     d1h:2.7,  volZ:1.5, bs:1.1, float:86,  funding:0.01,  flag:'green', profile:'stable'},
  {sym:'PEPE',     price:'$0.0000182', d1h:2.1,  volZ:1.2, bs:1.1, float:97,  funding:0.01,  flag:'green', profile:'stable'},
  {sym:'DOGE',     price:'$0.41',      d1h:0.4,  volZ:0.6, bs:1.0, float:100, funding:0.0,   flag:'green', profile:'flat'},
  {sym:'WEN',      price:'$0.00012',   d1h:-0.8, volZ:0.7, bs:0.9, float:100, funding:-0.01, flag:'green', profile:'flat'},
  {sym:'SHIB',     price:'$0.0000241', d1h:-1.2, volZ:0.9, bs:0.8, float:58,  funding:-0.02, flag:'green', profile:'stable'},
  {sym:'GOAT',     price:'$0.55',      d1h:-3.4, volZ:1.8, bs:0.7, float:81,  funding:-0.03, flag:'green', profile:'fade'},
];

const PROFILES = {
  rave:   {circ:[24,24,24,25,25,27,30,34,40,55,72,78,80,80], price:[0.30,0.30,0.30,0.30,0.40,1.2,4,9,18,27,14,3,1,0.6], marker:4},
  rising: {circ:[68,68,69,70,70,71,72,73,74,75,76,77,78,78], price:[0.5,0.5,0.6,0.7,0.9,1.1,1.4,1.6,1.7,1.9,2.0,2.1,2.0,2.14], marker:3},
  fade:   {circ:[40,42,45,50,58,66,70,72,74,75,76,77,78,79], price:[0.2,0.5,1.2,2.0,2.6,2.2,1.8,1.5,1.3,1.1,1.0,0.9,0.85,0.8], marker:2},
  accum:  {circ:[60,59,57,55,52,50,48,46,44,43,42,41,40,40], price:[1.0,1.0,1.01,0.99,1.0,1.02,1.01,1.03,1.02,1.04,1.05,1.06,1.07,1.08], marker:-1},
  stable: {circ:[95,95,96,96,95,96,97,96,97,96,97,97,96,97], price:[1.0,1.02,0.99,1.01,1.03,1.0,0.98,1.02,1.0,1.01,0.99,1.0,1.01,1.0], marker:-1},
  flat:   {circ:[100,100,100,100,100,100,100,100,100,100,100,100,100,100], price:[0.40,0.41,0.40,0.41,0.41,0.40,0.41,0.42,0.41,0.41,0.40,0.41,0.41,0.41], marker:-1},
};

const DATES = (function(){
  const t = new Date(); const arr = [];
  for(let i=13;i>=0;i--){ const d=new Date(t); d.setDate(t.getDate()-i); arr.push(d); }
  return arr;
})();
const fmtDate = d => ("0"+d.getDate()).slice(-2)+"."+("0"+(d.getMonth()+1)).slice(-2)+".";
const fmt = v => v >= 1 ? v.toFixed(2) : Number(v.toPrecision(2)).toString();

function FloatChart({circ, price, marker}){
  const n = circ.length;
  const W = 680, H = 290, padL = 46, padR = 46, padT = 18, padB = 50;
  const plotL = padL, plotR = W - padR, plotTop = padT, plotBottom = H - padB;
  const plotW = plotR - plotL, plotH = plotBottom - plotTop;
  const x = i => plotL + i * (plotW / (n - 1));
  const yP = p => plotBottom - (p / 100) * plotH;
  const pmin = Math.min.apply(null, price), pmax = Math.max.apply(null, price);
  const span = (pmax - pmin) || 1;
  const yPr = v => plotBottom - ((v - pmin) / span) * plotH;
  const green = x(0) + "," + plotBottom + " " + circ.map((c,i)=>x(i)+","+yP(c)).join(" ") + " " + x(n-1) + "," + plotBottom;
  const orange = circ.map((c,i)=>x(i)+","+yP(c)).join(" ") + " " + x(n-1) + "," + yP(100) + " " + x(0) + "," + yP(100);
  const pl = price.map((v,i)=>x(i)+","+yPr(v)).join(" ");
  const txt = "#9aa0a8";
  const xticks = [0,3,7,10,13].filter(i=>i<n);
  return (
    <svg viewBox={"0 0 "+W+" "+H} width="100%" style={{display:"block"}}>
      {[0,25,50,75,100].map(p=>(
        <line key={p} x1={plotL} x2={plotR} y1={yP(p)} y2={yP(p)} stroke="#ffffff" strokeOpacity="0.06"/>
      ))}
      <polygon points={green} fill="#1D9E75" fillOpacity="0.32"/>
      <polygon points={orange} fill="#EF9F27" fillOpacity="0.30"/>
      {marker >= 0 ? <line x1={x(marker)} x2={x(marker)} y1={plotTop} y2={plotBottom} stroke="#9aa0a8" strokeWidth="1" strokeDasharray="4 4"/> : null}
      {marker >= 0 ? <text x={x(marker)} y={plotTop-5} textAnchor="middle" fontSize="11" fill={txt}>Insider → Börse ({fmtDate(DATES[marker])})</text> : null}
      <polyline points={pl} fill="none" stroke="#8B82F0" strokeWidth="2"/>
      <line x1={plotL} x2={plotL} y1={plotTop} y2={plotBottom} stroke="#ffffff" strokeOpacity="0.12"/>
      <line x1={plotL} x2={plotR} y1={plotBottom} y2={plotBottom} stroke="#ffffff" strokeOpacity="0.12"/>
      {[0,25,50,75,100].map(p=>(
        <text key={"l"+p} x={plotL-6} y={yP(p)+3} textAnchor="end" fontSize="11" fill={txt}>{p}%</text>
      ))}
      {xticks.map(i=>(
        <text key={"x"+i} x={x(i)} y={plotBottom+17} textAnchor="middle" fontSize="11" fill={txt}>{fmtDate(DATES[i])}</text>
      ))}
      <text x={plotR+6} y={plotTop+4} textAnchor="start" fontSize="11" fill={txt}>${fmt(pmax)}</text>
      <text x={plotR+6} y={plotBottom+3} textAnchor="start" fontSize="11" fill={txt}>${fmt(pmin)}</text>
    </svg>
  );
}

function Info({text}){
  return (
    <span className="info" tabIndex={0} role="img" aria-label="Hinweis">!
      <span className="tip">{text}</span>
    </span>
  );
}

function Flag({c}){
  const col = c === "red" ? "#e35b5a" : c === "amber" ? "#EF9F27" : "#3ec07a";
  return <span className="dot" style={{background:col}}/>;
}

function zClass(v){ return v >= 5 ? "zhi" : v >= 3 ? "zmid" : ""; }

function App(){
  const [open, setOpen] = useState(null);
  return (
    <div className="wrap">
      <p className="title">SignalDesk · Float-Screener</p>
      <p className="subtitle">handelbares Universum · Klick auf eine Zeile öffnet den Float-Verlauf</p>
      <div className="chips">
        {["Bitpanda","Phemex","Binance","Crypto.com"].map(p=>(
          <span key={p} className="chip on">{p}</span>
        ))}
      </div>
      <div className="card">
        <table className="scr">
          <thead><tr>
            <th>Coin</th><th>Preis</th><th>Δ 1h</th>
            <th className="c-volz">Vol-Z</th><th className="c-bs">B/S</th>
            <th>Float</th><th className="c-fund">Funding</th><th>Flag</th>
          </tr></thead>
          <tbody>
            {COINS.map(co=>{
              const isOpen = open === co.sym;
              const pr = PROFILES[co.profile];
              return (
                <React.Fragment key={co.sym}>
                  <tr className={"row" + (isOpen ? " open" : "")} onClick={()=>setOpen(isOpen ? null : co.sym)}>
                    <td className="sym">
                      <span className="chev" style={{transform: isOpen ? "rotate(90deg)" : "none"}}>▸</span>
                      {co.sym}
                    </td>
                    <td>{co.price}</td>
                    <td className={co.d1h >= 0 ? "pos" : "neg"}>{(co.d1h >= 0 ? "+" : "") + co.d1h.toFixed(1)}%</td>
                    <td className="c-volz">{zClass(co.volZ) ? <span className={zClass(co.volZ)}>{co.volZ.toFixed(1)}</span> : co.volZ.toFixed(1)}</td>
                    <td className="c-bs">{co.bs.toFixed(1)}</td>
                    <td>{co.float}%</td>
                    <td className={"c-fund " + (co.funding > 0 ? "pos" : co.funding < 0 ? "neg" : "mut")}>{(co.funding > 0 ? "+" : "") + co.funding.toFixed(2)}%</td>
                    <td><Flag c={co.flag}/></td>
                  </tr>
                  {isOpen ? (
                    <tr className="detail"><td colSpan={8}>
                      <div className="detailwrap">
                        <div className="dhead">
                          Float-Verlauf · {co.sym} <span className="range">({fmtDate(DATES[0])} – {fmtDate(DATES[DATES.length-1])})</span>
                          <Info text={'Keyless-Näherung: Umlauf gegen Gesamtangebot. Das rote „auf Börse“-Band lässt sich später per bezahlter API einstecken!'}/>
                        </div>
                        <FloatChart circ={pr.circ} price={pr.price} marker={pr.marker}/>
                        <div className="legend">
                          <span><i className="sw" style={{background:"#1D9E75"}}/>Im Umlauf</span>
                          <span><i className="sw" style={{background:"#EF9F27"}}/>Überhang (bereit)
                            <Info text={'Überhang = gesperrte oder bei Insidern liegende Coins. Niedriger Float = latentes Dump-Risiko!'}/>
                          </span>
                          <span><i className="ln" style={{background:"#8B82F0"}}/>Preis</span>
                        </div>
                      </div>
                    </td></tr>
                  ) : null}
                </React.Fragment>
              );
            })}
          </tbody>
        </table>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
