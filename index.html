<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SignalDesk · Float-Screener</title>
<style>
:root{--bg:#13151a;--surface:#1b1e25;--surface2:#22262e;--text:#e7e9ee;--muted:#9aa0a8;
--hint:#6f747c;--border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.05);--pos:#3ec07a;--neg:#e35b5a;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding:20px 14px;line-height:1.5}
.wrap{max-width:1220px;margin:0 auto}
.title{font-size:18px;font-weight:600;margin:0}
.subtitle{font-size:13px;color:var(--muted);margin:2px 0 14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{font-size:12px;padding:4px 10px;border-radius:999px;border:0.5px solid var(--border);background:var(--surface);color:var(--muted)}
.chip.on{background:rgba(91,141,239,0.16);color:#9cbcff;border-color:rgba(91,141,239,0.4)}
.searchbar{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.searchbar input{background:var(--surface2);border:0.5px solid var(--border);color:var(--text);border-radius:8px;padding:7px 11px;font-size:13px;width:240px;max-width:60vw}
.count{font-size:12px;color:var(--hint);margin:0 0 10px}
.card{border:0.5px solid var(--border);border-radius:12px;background:var(--surface);overflow-x:auto}
.scr{width:100%;min-width:1120px;border-collapse:collapse;font-size:13px}
.scr th{font-weight:500;color:var(--hint);text-align:right;padding:9px 8px;font-size:11px;border-bottom:0.5px solid var(--border);user-select:none}
.scr thead tr:first-child th{cursor:pointer}
.scr thead tr:first-child th:hover{color:var(--text)}
.scr th:first-child,.scr td.sym{text-align:left}
.filt th{padding:4px 6px 8px;border-bottom:0.5px solid var(--border);cursor:default}
.fin{width:50px;background:var(--surface2);border:0.5px solid var(--border);color:var(--text);border-radius:6px;padding:3px 5px;font-size:11px;text-align:right}
.fin:disabled{opacity:.35;cursor:not-allowed}
.fin.sel{width:auto;text-align:left;padding:3px 6px}
.scr td{padding:9px 8px;text-align:right;border-bottom:0.5px solid var(--border2);white-space:nowrap}
.row{cursor:pointer}
.row:hover,.row.open{background:var(--surface2)}
.sym{font-weight:600}
.chev{display:inline-block;margin-right:7px;color:var(--muted);transition:transform .15s;font-size:11px}
.pos{color:var(--pos)} .neg{color:var(--neg)} .mut{color:var(--muted)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%}
.zhi{background:rgba(227,91,90,0.18);color:#f08f8e;border-radius:4px;padding:1px 6px}
.zmid{background:rgba(239,159,39,0.18);color:#f0b65f;border-radius:4px;padding:1px 6px}
.empty{padding:26px 20px;text-align:center;color:var(--muted);font-size:13px;line-height:1.6}
.empty code{background:var(--surface2);padding:1px 6px;border-radius:5px;font-size:12px}
.detail td{padding:0}
.detailwrap{padding:14px 14px 16px}
.dhead{font-size:13px;color:var(--text);margin-bottom:8px;font-weight:500}
.range{color:var(--hint);font-weight:400;font-size:12px}
.note{font-size:12px;color:var(--muted);padding:14px 2px}
.legend{display:flex;flex-wrap:wrap;gap:16px;font-size:12px;color:var(--muted);margin-top:8px}
.legend span{display:flex;align-items:center;gap:6px}
.sw{display:inline-block;width:11px;height:11px;border-radius:3px;opacity:.75}
.ln{display:inline-block;width:14px;height:3px;border-radius:2px}
.info{position:relative;display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:50%;background:rgba(239,159,39,0.22);color:#f0b65f;font-size:10px;font-weight:700;cursor:help;vertical-align:middle;margin-left:5px}
.info:focus{outline:none}
.tip{visibility:hidden;opacity:0;position:absolute;top:150%;left:0;width:230px;background:var(--surface2);color:var(--text);border:0.5px solid var(--border);border-radius:8px;padding:8px 10px;font-size:12px;font-weight:400;line-height:1.45;text-align:left;z-index:40;transition:opacity .12s;box-shadow:0 6px 22px rgba(0,0,0,0.45)}
.tip.r{left:auto;right:0}
.info:hover .tip,.info:focus .tip{visibility:visible;opacity:1}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script type="text/babel">
const {useState, useEffect} = React;
const D = "–";

const DATES=(function(){ const t=new Date(); const a=[]; for(let i=13;i>=0;i--){ const d=new Date(t); d.setDate(t.getDate()-i); a.push(d);} return a; })();
const fmtDate=d=>("0"+d.getDate()).slice(-2)+"."+("0"+(d.getMonth()+1)).slice(-2)+".";
const fmtP=v=>v>=1?v.toFixed(2):Number(v.toPrecision(2)).toString();
function abbr(n){ if(n==null) return D; const a=Math.abs(n);
  if(a>=1e9) return '$'+(n/1e9).toFixed(2)+'B';
  if(a>=1e6) return '$'+(n/1e6).toFixed(1)+'M';
  if(a>=1e3) return '$'+(n/1e3).toFixed(0)+'k';
  return '$'+n.toFixed(0); }
const pf = v => v==null ? D : (v>=0?'+':'')+v.toFixed(1)+'%';

function FloatChart({circ,price,marker}){
  const n=circ.length,W=680,H=290,padL=46,padR=46,padT=18,padB=50;
  const plotL=padL,plotR=W-padR,plotTop=padT,plotBottom=H-padB,plotW=plotR-plotL,plotH=plotBottom-plotTop;
  const x=i=>plotL+i*(plotW/(n-1)), yP=p=>plotBottom-(p/100)*plotH;
  const pmin=Math.min.apply(null,price),pmax=Math.max.apply(null,price),span=(pmax-pmin)||1;
  const yPr=v=>plotBottom-((v-pmin)/span)*plotH;
  const green=x(0)+","+plotBottom+" "+circ.map((c,i)=>x(i)+","+yP(c)).join(" ")+" "+x(n-1)+","+plotBottom;
  const orange=circ.map((c,i)=>x(i)+","+yP(c)).join(" ")+" "+x(n-1)+","+yP(100)+" "+x(0)+","+yP(100);
  const pl=price.map((v,i)=>x(i)+","+yPr(v)).join(" ");
  const txt="#9aa0a8",xticks=[0,3,7,10,13].filter(i=>i<n);
  return (
    <svg viewBox={"0 0 "+W+" "+H} width="100%" style={{display:"block"}}>
      {[0,25,50,75,100].map(p=>(<line key={p} x1={plotL} x2={plotR} y1={yP(p)} y2={yP(p)} stroke="#ffffff" strokeOpacity="0.06"/>))}
      <polygon points={green} fill="#1D9E75" fillOpacity="0.32"/>
      <polygon points={orange} fill="#EF9F27" fillOpacity="0.30"/>
      {marker>=0?<line x1={x(marker)} x2={x(marker)} y1={plotTop} y2={plotBottom} stroke="#9aa0a8" strokeWidth="1" strokeDasharray="4 4"/>:null}
      {marker>=0?<text x={x(marker)} y={plotTop-5} textAnchor="middle" fontSize="11" fill={txt}>Insider → Börse ({fmtDate(DATES[marker])})</text>:null}
      <polyline points={pl} fill="none" stroke="#8B82F0" strokeWidth="2"/>
      <line x1={plotL} x2={plotL} y1={plotTop} y2={plotBottom} stroke="#ffffff" strokeOpacity="0.12"/>
      <line x1={plotL} x2={plotR} y1={plotBottom} y2={plotBottom} stroke="#ffffff" strokeOpacity="0.12"/>
      {[0,25,50,75,100].map(p=>(<text key={"l"+p} x={plotL-6} y={yP(p)+3} textAnchor="end" fontSize="11" fill={txt}>{p}%</text>))}
      {xticks.map(i=>(<text key={"x"+i} x={x(i)} y={plotBottom+17} textAnchor="middle" fontSize="11" fill={txt}>{fmtDate(DATES[i])}</text>))}
      <text x={plotR+6} y={plotTop+4} textAnchor="start" fontSize="11" fill={txt}>${fmtP(pmax)}</text>
      <text x={plotR+6} y={plotBottom+3} textAnchor="start" fontSize="11" fill={txt}>${fmtP(pmin)}</text>
    </svg>
  );
}
function Info({text,side}){ return <span className="info" tabIndex={0} role="img" aria-label="Hilfe" onClick={e=>e.stopPropagation()}><span style={{pointerEvents:"none"}}>!</span><span className={"tip"+(side==="r"?" r":"")}>{text}</span></span>; }
function Flag({c}){ if(!c) return <span>{D}</span>; const col=c==="red"?"#e35b5a":c==="amber"?"#EF9F27":"#3ec07a"; return <span className="dot" style={{background:col}}/>; }
function zClass(v){ return v>=5?"zhi":v>=3?"zmid":""; }
function fmClass(v){ return v>=3?"zhi":v>=1?"zmid":""; }

const COLS=[["sym","Coin",""],["priceNum","Preis",""],["liq","Liq","c-liq"],["mcap","MCap","c-mcap"],
["fdv","FDV","c-fdv"],["volZ","Vol-Z","c-volz"],["bs","B/S","c-bs"],["float","Float",""],["fmom","F-Mom",""],
["funding","Funding","c-fund"],["flag","Flag",""],["d1h","Δ 1h",""],["d1pct","1 T",""],["w1pct","1 W","c-1w"],["m1pct","1 M","c-1m"]];
const FILTERMODE={priceNum:"min",liq:"min",mcap:"min",fdv:"min",volZ:"min",bs:"min",float:"max",fmom:"min",funding:"min",d1h:"min",d1pct:"min",w1pct:"min",m1pct:"min",flag:"select"};
const HELP={priceNum:"Aktueller Kurs.",
liq:"Handelbares Kapital im Markt. Dünn = hoher Slippage, leicht manipulierbar!",
mcap:"Marktkapitalisierung = Umlauf × Preis.",
fdv:"Voll verwässerte Bewertung = Gesamtangebot × Preis. Große Lücke zu MCap = großer Überhang!",
volZ:"Volumen relativ zum eigenen Schnitt. Über 5 = ungewöhnlicher Ausbruch!",
bs:"Käufer- zu Verkäufer-Volumen. Über 1 = Kaufdruck.",
float:"Anteil im Umlauf vs. Gesamt. Niedrig = viel Überhang bei Insidern, latentes Dump-Risiko!",
fmom:"Float-Momentum: wie schnell der Umlauf gerade wächst (Δ pro 24 h). Hoch = jetzt wird Angebot auf die Börsen geschoben, Verteilung läuft!",
funding:"Perp-Finanzierungsrate. Extrem = überfüllte Position, Squeeze-Gefahr!",
flag:"Ampel: rot = mehrere Risikomerkmale zugleich, grün = unauffällig.",
d1h:"Kursänderung in der letzten Stunde.",d1pct:"Kursänderung über 1 Tag.",w1pct:"Kursänderung über 1 Woche.",m1pct:"Kursänderung über 1 Monat."};

function App(){
  const [open,setOpen]=useState(null);
  const [q,setQ]=useState("");
  const [colF,setColF]=useState({});
  const [sortKey,setSortKey]=useState("mcap"); const [sortDir,setSortDir]=useState("desc");
  const [coins,setCoins]=useState(null); const [src,setSrc]=useState("");

  useEffect(()=>{ fetch("data/coins.json").then(r=>r.ok?r.json():Promise.reject()).then(j=>{
    if(Array.isArray(j)){ const seen={}; const uniq=j.filter(c=>{ const s=(c.sym||""); if(!s||seen[s]) return false; seen[s]=1; return true; }); setCoins(uniq); setSrc("Live · keyless (CoinGecko)"); } else setCoins([]);
  }).catch(()=>setCoins([])); },[]);

  const setF=(k,v)=>setColF(p=>{ const n=Object.assign({},p); n[k]=v; return n; });
  const num=v=>{ if(v===undefined||v==="") return null; const n=parseFloat(String(v).replace(",",".")); return isNaN(n)?null:n; };
  const onSort=k=>{ if(k===sortKey){ setSortDir(sortDir==="asc"?"desc":"asc"); } else { setSortKey(k); setSortDir(k==="sym"?"asc":"desc"); } };

  const loaded = coins!==null;
  const base = coins||[];
  const hasData={}; for(const k in FILTERMODE){ hasData[k] = k==="flag" ? true : base.some(c=>c[k]!=null); }
  let rows=base.filter(c=>{
    if(q && (c.sym||"").toLowerCase().indexOf(q.toLowerCase().trim())===-1) return false;
    for(const k in FILTERMODE){
      const mode=FILTERMODE[k], raw=colF[k];
      if(mode==="select"){ if(raw && raw!=="all" && c[k]!==raw) return false; continue; }
      const t=num(raw); if(t===null) continue;
      const v=c[k]; if(v==null) return false;
      if(mode==="min" && v<t) return false;
      if(mode==="max" && v>t) return false;
    }
    return true;
  });
  const rank={red:3,amber:2,green:1};
  rows=rows.slice().sort((a,b)=>{
    const dir=sortDir==="asc"?1:-1;
    if(sortKey==="sym") return dir*String(a.sym).localeCompare(String(b.sym));
    let av=sortKey==="flag"?rank[a.flag]:a[sortKey], bv=sortKey==="flag"?rank[b.flag]:b[sortKey];
    if(av==null&&bv==null) return 0; if(av==null) return 1; if(bv==null) return -1;
    return dir*(av-bv);
  });

  return (
    <div className="wrap">
      <p className="title">SignalDesk · Float-Screener</p>
      <p className="subtitle">Suche nach Namen oben · filtern und sortieren über den Tabellenkopf · „!" zeigt Hilfe</p>
      <div className="chips">{["Bitpanda","Phemex","Binance","Crypto.com"].map(p=>(<span key={p} className="chip on">{p}</span>))}</div>
      <div className="searchbar"><input placeholder="Suche nach Name…" value={q} onChange={e=>setQ(e.target.value)}/></div>
      <p className="count">{!loaded ? "Lade Daten…" : (base.length+" Coins geladen · "+rows.length+" nach Filter · Quelle: "+src)}</p>

      {!loaded ? (
        <div className="card"><div className="empty">Lade Daten…</div></div>
      ) : base.length===0 ? (
        <div className="card"><div className="empty">
          Noch keine Live-Daten gefunden.<br/>
          Starte die GitHub-Action („Run workflow"), damit <code>data/coins.json</code> erzeugt wird — danach erscheinen die Coins hier automatisch.
        </div></div>
      ) : (
        <div className="card">
          <table className="scr">
            <thead>
              <tr>{COLS.map((c,idx)=>(
                <th key={c[0]} className={c[2]} onClick={()=>onSort(c[0])}>
                  {c[1]}{sortKey===c[0]?(sortDir==="asc"?" ▲":" ▼"):""}
                  {HELP[c[0]]?<Info text={HELP[c[0]]} side={idx>=8?"r":"l"}/>:null}
                </th>
              ))}</tr>
              <tr className="filt">{COLS.map(c=>{ const k=c[0],mode=FILTERMODE[k];
                if(!mode) return <th key={k} className={c[2]}></th>;
                if(mode==="select") return (<th key={k} className={c[2]}>
                  <select className="fin sel" value={colF.flag||"all"} onChange={e=>setF("flag",e.target.value)}>
                    <option value="all">alle</option><option value="red">rot</option><option value="amber">gelb</option><option value="green">grün</option>
                  </select></th>);
                return <th key={k} className={c[2]}><input className="fin" type="text" inputMode="decimal" disabled={!hasData[k]} title={hasData[k]?"":"noch keine Daten"} placeholder={hasData[k]?(mode==="max"?"≤":"≥"):"—"} value={colF[k]||""} onChange={e=>setF(k,e.target.value)}/></th>;
              })}</tr>
            </thead>
            <tbody>
              {rows.length===0 ? <tr><td className="empty" colSpan={COLS.length}>Keine Coins passen zu den Filtern.</td></tr> : rows.map(co=>{
                const isOpen=open===co.sym; const hasHist=co.floatHist&&co.priceHist;
                return (
                  <React.Fragment key={co.sym}>
                    <tr className={"row"+(isOpen?" open":"")} onClick={()=>setOpen(isOpen?null:co.sym)}>
                      <td className="sym"><span className="chev" style={{transform:isOpen?"rotate(90deg)":"none"}}>▸</span>{co.sym}</td>
                      <td>{co.priceStr||(co.priceNum!=null?"$"+co.priceNum:D)}</td>
                      <td className="c-liq">{abbr(co.liq)}</td>
                      <td className="c-mcap">{abbr(co.mcap)}</td>
                      <td className="c-fdv">{abbr(co.fdv)}</td>
                      <td className="c-volz">{co.volZ==null?D:(zClass(co.volZ)?<span className={zClass(co.volZ)}>{co.volZ.toFixed(1)}</span>:co.volZ.toFixed(1))}</td>
                      <td className="c-bs">{co.bs==null?D:co.bs.toFixed(1)}</td>
                      <td>{co.float==null?D:co.float+"%"}</td>
                      <td>{co.fmom==null?D:(fmClass(co.fmom)?<span className={fmClass(co.fmom)}>{pf(co.fmom)}</span>:pf(co.fmom))}</td>
                      <td className={"c-fund "+(co.funding>0?"pos":co.funding<0?"neg":"mut")}>{co.funding==null?D:(co.funding>0?"+":"")+co.funding.toFixed(2)+"%"}</td>
                      <td><Flag c={co.flag}/></td>
                      <td className={co.d1h>=0?"pos":"neg"}>{pf(co.d1h)}</td>
                      <td className={co.d1pct>=0?"pos":"neg"}>{pf(co.d1pct)}</td>
                      <td className={"c-1w "+(co.w1pct>=0?"pos":"neg")}>{pf(co.w1pct)}</td>
                      <td className={"c-1m "+(co.m1pct>=0?"pos":"neg")}>{pf(co.m1pct)}</td>
                    </tr>
                    {isOpen ? (
                      <tr className="detail"><td colSpan={COLS.length}>
                        <div className="detailwrap">
                          <div className="dhead">Float-Verlauf · {co.sym} {hasHist?<span className="range">({fmtDate(DATES[0])} – {fmtDate(DATES[DATES.length-1])})</span>:null}
                            <Info side="l" text={'Keyless-Näherung: Umlauf gegen Gesamtangebot. Das rote „auf Börse“-Band lässt sich später per bezahlter API einstecken!'}/>
                          </div>
                          {hasHist ? (
                            <React.Fragment>
                              <FloatChart circ={co.floatHist} price={co.priceHist} marker={co.marker==null?-1:co.marker}/>
                              <div className="legend">
                                <span><i className="sw" style={{background:"#1D9E75"}}/>Im Umlauf</span>
                                <span><i className="sw" style={{background:"#EF9F27"}}/>Überhang (bereit)
                                  <Info side="l" text={'Überhang = gesperrte oder bei Insidern liegende Coins. Niedriger Float = latentes Dump-Risiko!'}/></span>
                                <span><i className="ln" style={{background:"#8B82F0"}}/>Preis</span>
                              </div>
                            </React.Fragment>
                          ) : (
                            <div className="note">Float-Verlauf wird aufgebaut — sobald der Daten-Layer genug Schnappschüsse gesammelt hat, erscheint hier der echte Verlauf.</div>
                          )}
                        </div>
                      </td></tr>
                    ) : null}
                  </React.Fragment>
                );
              })}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
