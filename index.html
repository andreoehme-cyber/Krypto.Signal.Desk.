/* ----------------------------- Formatierung ----------------------------- */
let EURFX = null; // USD->EUR Faktor, wird beim Laden gesetzt
const _cur = (v, sym) => {
  if (v >= 1000) return sym + Number(v).toLocaleString("en-US", { maximumFractionDigits: 0 });
  if (v >= 1) return sym + v.toFixed(2);
  if (v >= 0.01) return sym + v.toFixed(4);
  if (v >= 0.0001) return sym + v.toFixed(6);
  return sym + v.toExponential(2);
};
const _big = (v, sym) => sym + Intl.NumberFormat("en-US", { notation: "compact", maximumFractionDigits: 1 }).format(v);
const fmtPrice = (p) =>
  p == null || isNaN(p) ? "—" : EURFX ? _cur(p, "$") + " / " + _cur(p * EURFX, "€") : _cur(p, "$");
const fmtPct = (x) => (x == null || isNaN(x) ? "—" : (x >= 0 ? "+" : "") + x.toFixed(1) + "%");
const fmtBig = (n) =>
  n == null || isNaN(n) ? "—" : EURFX ? _big(n, "$") + " / " + _big(n * EURFX, "€") : _big(n, "$");
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const ageStr = (ms) => {
  if (!ms) return "—";
  const h = (Date.now() - ms) / 36e5;
  if (h < 48) return Math.max(1, Math.round(h)) + "h";
  return Math.round(h / 24) + "d";
};
const fmtAgo = (ms) => {
  const h = (Date.now() - ms) / 36e5;
  if (h < 1) return Math.max(1, Math.round(h * 60)) + " Min";
  if (h < 48) return Math.round(h) + " Std";
  return Math.round(h / 24) + " Tagen";
};
const fmtIn = (ms) => {
  let s = (ms - Date.now()) / 1000;
  if (s < 0) s = 0;
  const d = Math.floor(s / 86400), h = Math.floor((s % 86400) / 3600), m = Math.floor((s % 3600) / 60);
  if (d > 0) return `${d}T ${h}h`;
  if (h > 0) return `${h}h ${m}m`;
  return `${m}m`;
};
const fmtDate = (ms) =>
  new Date(ms).toLocaleString("de-DE", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
const fmtDay = (ms) =>
  new Date(ms).toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit", year: "2-digit" });

/* ------------------------------- Scoring -------------------------------- */
function scoreMajor(m) {
  const { c7, c24, c1, funding, ls } = m;
  const factors = [];

  const s7 = clamp((c7 ?? 0) / 25, -1, 1);
  if (c7 != null) factors.push({ label: `7-Tage-Trend ${fmtPct(c7)}`, dir: s7 });
  const s24 = clamp((c24 ?? 0) / 10, -1, 1);
  if (c24 != null) factors.push({ label: `24h-Momentum ${fmtPct(c24)}`, dir: s24 });
  const s1 = clamp((c1 ?? 0) / 5, -1, 1);

  let sF = 0;
  if (funding != null) {
    sF = clamp(-funding / 0.0005, -1, 1);
    const ann = funding * 3 * 365 * 100;
    factors.push({
      label: `Funding ${(funding * 100).toFixed(3)}%/8h (≈${ann.toFixed(0)}%/Jahr)`,
      dir: sF, note: funding > 0 ? "überfüllte Longs" : funding < 0 ? "überfüllte Shorts" : "neutral",
    });
  } else factors.push({ label: "Funding nicht verfügbar", dir: 0 });

  let sLS = 0;
  if (ls != null) {
    sLS = clamp(-(ls - 1), -1, 1);
    factors.push({
      label: `Long/Short-Ratio ${ls.toFixed(2)}`,
      dir: sLS, note: ls > 1.2 ? "mehr Longs positioniert" : ls < 0.83 ? "mehr Shorts positioniert" : "ausgeglichen",
    });
  }

  let raw = 0.3 * s7 + 0.27 * s24 + 0.2 * sF + 0.13 * sLS + 0.1 * s1;
  if ((c24 ?? 0) > 25 && (funding ?? 0) > 0.0004) {
    raw -= 0.3;
    factors.push({ label: "Parabolisch + crowded Longs → Erschöpfungsrisiko", dir: -1 });
  }
  const volMcap = m.volume && m.mcap ? m.volume / m.mcap : null;
  if (volMcap != null)
    factors.push({ label: `Volumen/MCap ${(volMcap * 100).toFixed(0)}%`, dir: 0, note: volMcap > 0.15 ? "hohe Aktivität" : "ruhig" });
  if (m.oi != null) factors.push({ label: `Open Interest ${fmtBig(m.oi)} (${m.derivSrc})`, dir: 0 });

  const bias = clamp(raw, -1, 1) * 100;
  const signal = bias >= 35 ? "LONG" : bias <= -35 ? "SHORT" : "NEUTRAL";
  let conf = Math.abs(bias);
  if (funding == null) conf = Math.min(conf, 55);
  if (volMcap != null && volMcap > 0.15) conf += 8;
  const confidence = conf >= 60 ? "Hoch" : conf >= 35 ? "Mittel" : "Niedrig";
  return { bias, signal, confidence, factors };
}

function scoreSmall(t) {
  const factors = [];
  const s24 = clamp((t.h24 ?? 0) / 40, -1, 1);
  const s6 = clamp((t.h6 ?? 0) / 20, -1, 1);
  const s1 = clamp((t.h1 ?? 0) / 10, -1, 1);
  if (t.h24 != null) factors.push({ label: `24h ${fmtPct(t.h24)}`, dir: s24 });
  if (t.h6 != null) factors.push({ label: `6h ${fmtPct(t.h6)}`, dir: s6 });
  if (t.h1 != null) factors.push({ label: `1h ${fmtPct(t.h1)}`, dir: s1 });
  let raw = 0.5 * s24 + 0.3 * s6 + 0.2 * s1;

  const flags = [];
  if (t.liq != null && t.liq < 50000) flags.push("Niedrige Liquidität");
  if (t.ageMs && (Date.now() - t.ageMs) / 36e5 < 48) flags.push("Sehr neu");
  const vl = t.liq ? t.vol24 / t.liq : null;
  if (vl != null && vl > 3) flags.push("Extremes Vol/Liq");
  if (t.fdv && t.mcap && t.fdv > t.mcap * 5) flags.push("Hohe FDV/MCap");

  const bias = clamp(raw, 0, 1) * 100;
  const signal = bias >= 40 ? "LONG" : bias >= 15 ? "BEOBACHTEN" : "FLAU";
  const conf = bias - flags.length * 18;
  const confidence = conf >= 55 ? "Hoch" : conf >= 30 ? "Mittel" : "Niedrig";
  return { bias, signal, confidence, factors, flags, vl };
}

/* ----------------------------- Fibonacci ----------------------------- */
// ZigZag: signifikante Wellen (Swings) per Prozent-Umkehr erkennen, jüngste Welle zurückgeben.
function detectSwing(highs, lows, times, thr) {
  const n = highs.length;
  if (n < 3) return null;
  const pivots = [];
  let extHigh = highs[0], extHighIdx = 0, extLow = lows[0], extLowIdx = 0;
  let trend = 0, start = 1;
  for (let i = 1; i < n; i++) {
    if (highs[i] > extHigh) { extHigh = highs[i]; extHighIdx = i; }
    if (lows[i] < extLow) { extLow = lows[i]; extLowIdx = i; }
    if ((extHigh - lows[i]) / extHigh >= thr) {
      pivots.push({ price: extHigh, t: times[extHighIdx], type: "H" });
      trend = -1; extLow = lows[i]; extLowIdx = i; start = i; break;
    }
    if ((highs[i] - extLow) / extLow >= thr) {
      pivots.push({ price: extLow, t: times[extLowIdx], type: "L" });
      trend = 1; extHigh = highs[i]; extHighIdx = i; start = i; break;
    }
  }
  if (trend === 0) return { low: extLow, high: extHigh, lowT: times[extLowIdx], highT: times[extHighIdx] };
  let ext = trend === 1 ? extHigh : extLow;
  let extIdx = trend === 1 ? extHighIdx : extLowIdx;
  for (let i = start + 1; i < n; i++) {
    if (trend === 1) {
      if (highs[i] > ext) { ext = highs[i]; extIdx = i; }
      else if ((ext - lows[i]) / ext >= thr) { pivots.push({ price: ext, t: times[extIdx], type: "H" }); trend = -1; ext = lows[i]; extIdx = i; }
    } else {
      if (lows[i] < ext) { ext = lows[i]; extIdx = i; }
      else if ((highs[i] - ext) / ext >= thr) { pivots.push({ price: ext, t: times[extIdx], type: "L" }); trend = 1; ext = highs[i]; extIdx = i; }
    }
  }
  pivots.push({ price: ext, t: times[extIdx], type: trend === 1 ? "H" : "L" });
  if (pivots.length < 2) return { low: extLow, high: extHigh, lowT: times[extLowIdx], highT: times[extHighIdx] };
  const a = pivots[pivots.length - 2], b = pivots[pivots.length - 1];
  return {
    low: Math.min(a.price, b.price), high: Math.max(a.price, b.price),
    lowT: a.price <= b.price ? a.t : b.t, highT: a.price <= b.price ? b.t : a.t,
  };
}

// Retracement der jüngsten Welle + Schwellen (LONG über X, SHORT unter Y, sonst NEUTRAL).
function computeFib(low, high, lowT, highT, price) {
  const range = high - low;
  if (!(range > 0) || price == null) return null;
  const dir = lowT < highT ? "up" : "down";
  const retr = dir === "up" ? (high - price) / range : (price - low) / range;
  const levels = FIB_LEVELS.map((r) => ({ r, price: dir === "up" ? high - r * range : low + r * range }));
  // Extensions / Projektionen über den Swing hinaus (Kursziele in Trendrichtung)
  const EXT_RATIOS = [1.272, 1.618, 2.0, 2.618];
  const ext = EXT_RATIOS.map((r) => ({ r, price: dir === "up" ? low + r * range : high - r * range }));
  // Golden Pocket: 0,618–0,65-Retracement-Zone
  const g1 = dir === "up" ? high - 0.618 * range : low + 0.618 * range;
  const g2 = dir === "up" ? high - 0.65 * range : low + 0.65 * range;
  const gpLow = Math.min(g1, g2), gpHigh = Math.max(g1, g2);
  const b1 = dir === "up" ? high - 0.618 * range : low + 0.786 * range;
  const b2 = dir === "up" ? high - 0.786 * range : low + 0.618 * range;
  const longThreshold = Math.max(b1, b2);
  const shortThreshold = Math.min(b1, b2);
  const rec = price > longThreshold ? "LONG" : price < shortThreshold ? "SHORT" : "NEUTRAL";
  // Nähe zur nächsten Marke (Retracement + Swing-Enden + Extensions)
  const lbl = (r) => (r * 100).toFixed(1).replace(".0", "") + " %";
  const marks = levels.map((l) => ({ label: lbl(l.r), price: l.price }))
    .concat(ext.map((e) => ({ label: "Ext " + lbl(e.r), price: e.price })));
  const sorted = marks.slice().sort((a, b) => a.price - b.price);
  const above = sorted.find((m) => m.price > price) || null;
  const belowArr = sorted.filter((m) => m.price <= price);
  const below = belowArr.length ? belowArr[belowArr.length - 1] : null;
  let nearest = null, nd = Infinity;
  for (const m of marks) { const d = Math.abs(m.price - price); if (d < nd) { nd = d; nearest = m; } }
  const nearestPct = nearest && price ? (nd / price) * 100 : null;
  return {
    dir, retr, rec, levels, ext, gpLow, gpHigh,
    longThreshold, shortThreshold, swingLow: low, swingHigh: high,
    nearest, nearestPct, above, below,
  };
}

/* ----------------------------- Parser ----------------------------- */
function parseBybit(json) {
  const list = json?.result?.list || [];
  const map = {};
  for (const it of list) {
    map[it.symbol] = {
      funding: it.fundingRate != null ? parseFloat(it.fundingRate) : null,
      oi: it.openInterestValue != null ? parseFloat(it.openInterestValue) : null,
    };
  }
  return map;
}
function parsePhemex(json) {
  const list = json?.result || json?.data || [];
  const map = {};
  for (const it of Array.isArray(list) ? list : []) {
    const sym = it.symbol;
    if (!sym || !sym.endsWith("USDT")) continue;
    let f = it.fundingRateRr ?? it.fundingRate ?? it.predFundingRateRr;
    f = f != null ? parseFloat(f) : null;
    if (f != null && Math.abs(f) > 0.05) f = f / 1e8;     // evtl. skaliert (1e8)
    if (f != null && Math.abs(f) > 0.05) f = null;         // immer noch unplausibel -> verwerfen
    let oi = it.openInterestRv ?? it.openInterest;
    oi = oi != null ? parseFloat(oi) : null;
    map[sym] = { funding: f, oi };
  }
  return map;
}

// EMA-Reihe (geglättet, seed = erster Wert; Warm-up über die ersten Kerzen)
function emaSeries(arr, period) {
  const k = 2 / (period + 1);
  const out = [];
  let prev = arr.length ? arr[0] : 0;
  for (let i = 0; i < arr.length; i++) {
    prev = i === 0 ? arr[0] : arr[i] * k + prev * (1 - k);
    out.push(prev);
  }
  return out;
}

// 5-Minuten-Kerzen laden; Bollinger (20) und MACD (12,26,9) berechnen; jeweils letzte 12 h zeigen
async function fetchChartData(sym) {
  const j = await fetch(BYBIT_KLINE_BB(sym)).then((r) => r.json());
  const list = j?.result?.list || [];
  if (list.length < 35) return null;
  const chron = list.slice().reverse(); // ältester -> neuester
  const closes = chron.map((c) => +c[4]);
  const times = chron.map((c) => +c[0]);
  // Bollinger-Bänder (20 Perioden ± 2 σ)
  const bb = [];
  for (let i = 19; i < closes.length; i++) {
    const w = closes.slice(i - 19, i + 1);
    const mean = w.reduce((a, b) => a + b, 0) / 20;
    const sd = Math.sqrt(w.reduce((a, b) => a + (b - mean) ** 2, 0) / 20);
    bb.push({ t: times[i], close: closes[i], mid: mean, upper: mean + 2 * sd, lower: mean - 2 * sd });
  }
  // MACD (12, 26, 9) auf Close
  const e12 = emaSeries(closes, 12);
  const e26 = emaSeries(closes, 26);
  const macdLine = closes.map((_, i) => e12[i] - e26[i]);
  const sig = emaSeries(macdLine, 9);
  const macd = closes.map((_, i) => ({ t: times[i], macd: macdLine[i], signal: sig[i], hist: macdLine[i] - sig[i] }));
  return { bb: bb.slice(-144), macd: macd.slice(-144) }; // letzte 12 h (144 × 5 Min)
}

/* ------------------------------- UI ------------------------------------- */
function BiasGauge({ bias, signal }) {
  const pct = clamp((bias + 100) / 2, 0, 100);
  const col = signal === "LONG" ? C.long : signal === "SHORT" ? C.short : C.neutral;
  return (
    <div className="gauge">
      <div className="gauge-track">
        <div className="gauge-half left" /><div className="gauge-half right" />

      <div className="gauge-labels"><span>SHORT</span><span>NEUTRAL</span><span>LONG</span></div>
    </div>

}
function SignalBadge({ signal, confidence }) {
  const map = { LONG: C.long, SHORT: C.short, NEUTRAL: C.neutral, BEOBACHTEN: C.gold, FLAU: C.muted };

}
const StatusDot = ({ ok }) => (

// Kleiner SVG-Chart: Bollinger-Band-Fläche, Mittellinie, Kurslinie + Live-Preis-Marker
function BollingerChart({ pts, price, color }) {
  if (!pts || pts.length < 2) return null;
  const W = 320, H = 130, pad = 5;
  const n = pts.length;
  const vals = pts.flatMap((p) => [p.upper, p.lower]);
  if (price != null && isFinite(price)) vals.push(price);
  let ymin = Math.min(...vals), ymax = Math.max(...vals);
  if (ymax === ymin) ymax = ymin + 1;
  const x = (i) => pad + (i / (n - 1)) * (W - 2 * pad);
  const y = (v) => pad + (1 - (v - ymin) / (ymax - ymin)) * (H - 2 * pad);
  const line = (key) => pts.map((p, i) => `${i === 0 ? "M" : "L"}${x(i).toFixed(1)},${y(p[key]).toFixed(1)}`).join(" ");
  const area =
    pts.map((p, i) => `${i === 0 ? "M" : "L"}${x(i).toFixed(1)},${y(p.upper).toFixed(1)}`).join(" ") +
    " " +
    pts.slice().reverse().map((p, i) => `L${x(n - 1 - i).toFixed(1)},${y(p.lower).toFixed(1)}`).join(" ") +
    " Z";
  const py = price != null && isFinite(price) ? y(price) : null;
  return (
    <svg className="bbchart" viewBox={`0 0 ${W} ${H}`} preserveAspectRatio="none">
      <path d={area} fill="#6B86B022" stroke="none" />
      <path d={line("upper")} fill="none" stroke="#6B86B0" strokeWidth="1" vectorEffect="non-scaling-stroke" />
      <path d={line("lower")} fill="none" stroke="#6B86B0" strokeWidth="1" vectorEffect="non-scaling-stroke" />
      <path d={line("mid")} fill="none" stroke="#F2B23E" strokeWidth="1" strokeDasharray="3 3" vectorEffect="non-scaling-stroke" />
      <path d={line("close")} fill="none" stroke={color || "#E7ECF5"} strokeWidth="1.6" vectorEffect="non-scaling-stroke" />
      {py != null && (
        <g>
          <line x1={pad} y1={py} x2={W - pad} y2={py} stroke={color || "#E7ECF5"} strokeWidth="0.8" strokeDasharray="2 3" vectorEffect="non-scaling-stroke" opacity="0.5" />
          <circle cx={x(n - 1)} cy={py} r="3" fill={color || "#E7ECF5"} />
        </g>
      )}
    </svg>
  );
}

// MACD-Chart: Histogramm-Balken (grün/rot), MACD-Linie (weiß) + Signallinie (gold), Nulllinie
function MacdChart({ pts }) {
  if (!pts || pts.length < 2) return null;
  const W = 320, H = 130, pad = 5;
  const n = pts.length;
  const vals = pts.flatMap((p) => [p.macd, p.signal, p.hist]);
  vals.push(0);
  let ymin = Math.min(...vals), ymax = Math.max(...vals);
  if (ymax === ymin) ymax = ymin + 1;
  const x = (i) => pad + (i / (n - 1)) * (W - 2 * pad);
  const y = (v) => pad + (1 - (v - ymin) / (ymax - ymin)) * (H - 2 * pad);
  const zeroY = y(0);
  const bw = Math.max(0.6, ((W - 2 * pad) / n) * 0.7);
  const macdPath = pts.map((p, i) => `${i === 0 ? "M" : "L"}${x(i).toFixed(1)},${y(p.macd).toFixed(1)}`).join(" ");
  const sigPath = pts.map((p, i) => `${i === 0 ? "M" : "L"}${x(i).toFixed(1)},${y(p.signal).toFixed(1)}`).join(" ");
  return (
    <svg className="bbchart" viewBox={`0 0 ${W} ${H}`} preserveAspectRatio="none">
      {pts.map((p, i) => {
        const yh = y(p.hist);
        const top = Math.min(zeroY, yh);
        const h = Math.max(0.4, Math.abs(zeroY - yh));
        return <rect key={i} x={(x(i) - bw / 2).toFixed(1)} y={top.toFixed(1)} width={bw.toFixed(1)} height={h.toFixed(1)} fill={p.hist >= 0 ? "#34D39988" : "#FF5C6C88"} />;
      })}
      <line x1={pad} y1={zeroY} x2={W - pad} y2={zeroY} stroke="#23314A" strokeWidth="1" vectorEffect="non-scaling-stroke" />
      <path d={macdPath} fill="none" stroke="#E7ECF5" strokeWidth="1.4" vectorEffect="non-scaling-stroke" />
      <path d={sigPath} fill="none" stroke="#F2B23E" strokeWidth="1.4" vectorEffect="non-scaling-stroke" />
    </svg>
  );
}

// Fibonacci-Overlay: Wochen-Kursverlauf + Retracement-/Extension-Linien, Golden-Pocket-Band, Live-Preis
function FibChart({ series, fib, price }) {
  if (!series || series.length < 3 || !fib) return null;
  const W = 320, H = 150, pad = 5;
  const n = series.length;
  const nearExt = fib.ext.filter((e) => e.r <= 1.618);
  const vals = series.concat(fib.levels.map((l) => l.price)).concat(nearExt.map((e) => e.price)).concat([fib.gpLow, fib.gpHigh]);
  if (price != null && isFinite(price)) vals.push(price);
  let ymin = Math.min(...vals), ymax = Math.max(...vals);
  if (ymax === ymin) ymax = ymin + 1;
  const padY = (ymax - ymin) * 0.04; ymin -= padY; ymax += padY;
  const x = (i) => pad + (i / (n - 1)) * (W - 2 * pad);
  const y = (v) => pad + (1 - (v - ymin) / (ymax - ymin)) * (H - 2 * pad);
  const inR = (v) => v >= ymin && v <= ymax;
  const pricePath = series.map((v, i) => `${i === 0 ? "M" : "L"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  const py = price != null && isFinite(price) ? y(price) : null;
  const pcol = fib.rec === "LONG" ? "#34D399" : fib.rec === "SHORT" ? "#FF5C6C" : "#6B86B0";
  return (
    <svg className="bbchart" viewBox={`0 0 ${W} ${H}`} preserveAspectRatio="none">
      {inR(fib.gpLow) && inR(fib.gpHigh) && (
        <rect x={pad} y={Math.min(y(fib.gpHigh), y(fib.gpLow)).toFixed(1)} width={(W - 2 * pad).toFixed(1)} height={Math.abs(y(fib.gpHigh) - y(fib.gpLow)).toFixed(1)} fill="#F2B23E22" />
      )}
      {fib.levels.filter((l) => inR(l.price)).map((l) => (
        <line key={"r" + l.r} x1={pad} y1={y(l.price).toFixed(1)} x2={W - pad} y2={y(l.price).toFixed(1)}
          stroke={l.r === 0 || l.r === 1 ? "#8A98B0" : "#23314A"} strokeWidth={l.r === 0 || l.r === 1 ? "1" : "0.8"} vectorEffect="non-scaling-stroke" />
      ))}
      {nearExt.filter((e) => inR(e.price)).map((e) => (
        <line key={"e" + e.r} x1={pad} y1={y(e.price).toFixed(1)} x2={W - pad} y2={y(e.price).toFixed(1)}
          stroke="#F2B23E" strokeWidth="0.8" strokeDasharray="4 3" vectorEffect="non-scaling-stroke" opacity="0.8" />
      ))}
      <path d={pricePath} fill="none" stroke="#E7ECF5" strokeWidth="1.5" vectorEffect="non-scaling-stroke" />
      {py != null && (
        <g>
          <line x1={pad} y1={py} x2={W - pad} y2={py} stroke={pcol} strokeWidth="0.8" strokeDasharray="2 3" vectorEffect="non-scaling-stroke" opacity="0.6" />
          <circle cx={x(n - 1)} cy={py} r="3" fill={pcol} />
        </g>
      )}
    </svg>
  );
}

function CryptoSignalDashboard() {
  const [tab, setTab] = useState("majors");
  const [majors, setMajors] = useState([]);
  const [smalls, setSmalls] = useState([]);
  const [listings, setListings] = useState({ upcoming: [], recent: [] });
  const [global, setGlobal] = useState(null);
  const [status, setStatus] = useState({ cg: null, bybit: null, phemex: null, dx: null });
  const [loading, setLoading] = useState(true);
  const [updated, setUpdated] = useState(null);
  const [sortKey, setSortKey] = useState("bias");
  const [expanded, setExpanded] = useState(() => new Set());
  const [auto, setAuto] = useState(true);
  const [bbData, setBbData] = useState({});
  const timer = useRef(null);
  const fibCache = useRef({});
  const fibAt = useRef(0);
  const auxAt = useRef(0);

  const toggle = (id) =>
    setExpanded((prev) => { const n = new Set(prev); n.has(id) ? n.delete(id) : n.add(id); return n; });

  const loadMajors = useCallback(async () => {
    // Märkte mit einem Retry (CoinGecko-Limit kann kurzzeitig blocken)
    const getMarkets = async () => {
      for (let a = 0; a < 2; a++) {
        try { const r = await fetch(CG_MARKETS); if (!r.ok) throw 0; return await r.json(); }
        catch (e) { if (a === 0) await new Promise((s) => setTimeout(s, 1500)); }
      }
      return null;
    };
    const [cg, by, ph] = await Promise.allSettled([
      getMarkets(),
      fetch(BYBIT_TICKERS).then((r) => { if (!r.ok) throw 0; return r.json(); }),
      fetch(PHEMEX_TICKERS).then((r) => { if (!r.ok) throw 0; return r.json(); }),
    ]);

    // Marktüberblick + Wechselkurs nur alle 5 Min laden (schont CoinGeckos Limit)
    if (Date.now() - auxAt.current > 5 * 60 * 1000) {
      const [gl, fx] = await Promise.allSettled([
        fetch(CG_GLOBAL).then((r) => r.json()),
        fetch(CG_FX).then((r) => r.json()),
      ]);
      if (gl.status === "fulfilled" && gl.value?.data) {
        const d = gl.value.data;
        setGlobal({
          mcap: d.total_market_cap?.usd,
          change: d.market_cap_change_percentage_24h_usd,
          btcDom: d.market_cap_percentage?.btc,
          ethDom: d.market_cap_percentage?.eth,
        });
      }
      if (fx.status === "fulfilled" && fx.value?.bitcoin?.usd && fx.value?.bitcoin?.eur) {
        EURFX = fx.value.bitcoin.eur / fx.value.bitcoin.usd;
      }
      if (gl.status === "fulfilled" || fx.status === "fulfilled") auxAt.current = Date.now();
    }

    const bybitMap = by.status === "fulfilled" ? parseBybit(by.value) : {};
    const phemexMap = ph.status === "fulfilled" ? parsePhemex(ph.value) : {};
    const bybitOk = by.status === "fulfilled" && Object.keys(bybitMap).length > 0;
    const phemexOk = ph.status === "fulfilled" && Object.keys(phemexMap).length > 0;

    if (cg.status !== "fulfilled" || !Array.isArray(cg.value)) {
      setStatus((s) => ({ ...s, cg: false, bybit: bybitOk, phemex: phemexOk }));
      return;
    }

    // Long/Short-Ratio nur für die Top-10 Majors mit Bybit-Perp (sparsam)
    const lsTargets = cg.value
      .map((c) => (c.symbol || "").toUpperCase() + "USDT")
      .filter((s) => bybitMap[s])
      .slice(0, 10);
    const lsRes = await Promise.allSettled(
      lsTargets.map((s) =>
        fetch(BYBIT_LS(s)).then((r) => r.json()).then((j) => {
          const row = j?.result?.list?.[0];
          if (!row) return null;
          const buy = parseFloat(row.buyRatio), sell = parseFloat(row.sellRatio);
          return buy && sell ? { s, ratio: buy / sell, buy, sell } : null;
        })
      )
    );
    const lsMap = {};
    lsRes.forEach((r) => { if (r.status === "fulfilled" && r.value) lsMap[r.value.s] = r.value; });

    // Open-Interest-Veränderung 24h für die Top-10 Majors mit Bybit-Perp
    const oiRes = await Promise.allSettled(
      lsTargets.map((s) =>
        fetch(BYBIT_OI(s)).then((r) => r.json()).then((j) => {
          const list = j?.result?.list || [];
          if (list.length < 2) return null;
          const a = parseFloat(list[0].openInterest), b = parseFloat(list[1].openInterest);
          return a && b ? { s, chg: (a / b - 1) * 100 } : null;
        }).catch(() => null)
      )
    );
    const oiMap = {};
    oiRes.forEach((r) => { if (r.status === "fulfilled" && r.value) oiMap[r.value.s] = r.value.chg; });

    // Fibonacci: Tageskerzen (90T) nur alle 5 Min neu laden (Swings ändern sich kaum minütlich)
    const fibTargets = cg.value
      .map((c) => (c.symbol || "").toUpperCase() + "USDT")
      .filter((s) => bybitMap[s])
      .slice(0, 30);
    if (fibTargets.length && (Date.now() - fibAt.current > 5 * 60 * 1000 || Object.keys(fibCache.current).length === 0)) {
      const fetchKline = (s) =>
        fetch(BYBIT_KLINE(s)).then((r) => r.json()).then((j) => {
          const list = j?.result?.list || [];
          if (list.length < 3) return null;
          const chron = list.slice().reverse(); // ältester -> neuester
          const highs = chron.map((c) => +c[2]);
          const lows = chron.map((c) => +c[3]);
          const times = chron.map((c) => +c[0]);
          const sw = detectSwing(highs, lows, times, 0.2); // 20% Umkehr = signifikante Welle
          const closes = chron.map((c) => +c[4]);
          return sw ? { s, ...sw, closes, times } : null;
        }).catch(() => null);
      // In Schüben à 5 abfragen, um Bybits Rate-Limit nicht zu reizen
      for (let i = 0; i < fibTargets.length; i += 5) {
        const batch = fibTargets.slice(i, i + 5);
        const res = await Promise.allSettled(batch.map(fetchKline));
        res.forEach((r) => {
          if (r.status === "fulfilled" && r.value) {
            const v = r.value;
            fibCache.current[v.s] = {
              low: v.low, high: v.high, lowT: v.lowT, highT: v.highT,
              closes: v.closes.slice(-90), times: v.times.slice(-90),
            };
          }
        });
        if (i + 5 < fibTargets.length) await new Promise((res2) => setTimeout(res2, 220));
      }
      // Nur als "frisch" markieren, wenn wirklich Daten kamen — sonst nächster Refresh erneut versuchen
      if (Object.keys(fibCache.current).length > 0) fibAt.current = Date.now();
    }

    const rows = cg.value.map((c) => {
      const sym = (c.symbol || "").toUpperCase();
      const bsym = sym + "USDT";
      const d = bybitMap[bsym] || phemexMap[bsym] || {};
      const derivSrc = bybitMap[bsym] ? "Bybit" : phemexMap[bsym] ? "Phemex" : null;
      const m = {
        id: c.id, sym, name: c.name, img: c.image, rank: c.market_cap_rank,
        price: c.current_price, mcap: c.market_cap, volume: c.total_volume,
        c1: c.price_change_percentage_1h_in_currency,
        c24: c.price_change_percentage_24h_in_currency ?? c.price_change_percentage_24h,
        c7: c.price_change_percentage_7d_in_currency,
        funding: d.funding ?? null, oi: d.oi ?? null, derivSrc,
        ls: lsMap[bsym]?.ratio ?? null,

        lsSell: lsMap[bsym]?.sell ?? null,
        oiChg: oiMap[bsym] ?? null,

      const fc = fibCache.current[bsym];

      if (fc?.closes && fc.closes.length > 5) m.fibSeries = fc.closes;
      return { ...m, ...scoreMajor(m) };
    });
    setMajors(rows);
    setStatus((s) => ({ ...s, cg: true, bybit: bybitOk, phemex: phemexOk }));
  }, []);

  const loadListings = useCallback(async () => {
    try {
      const j = await fetch(BYBIT_INSTR).then((r) => { if (!r.ok) throw 0; return r.json(); });
      const list = j?.result?.list || [];
      const now = Date.now();
      const items = list

        .map((it) => ({ symbol: it.symbol, base: it.baseCoin, status: it.status, t: parseInt(it.launchTime, 10) }));

  const loadSmalls = useCallback(async () => {

                            </div>
                            {m.fibSeries && <FibChart series={m.fibSeries} fib={m.fib} price={m.price} />}
                            <div className="posmoney">
                              <span style={{ color: m.fib.rec === "LONG" ? C.long : m.fib.rec === "SHORT" ? C.short : C.neutral, fontWeight: 600 }}>Empfehlung: {m.fib.rec} · aktuell {(clamp(m.fib.retr, 0, 1.5) * 100).toFixed(0)} % Retracement</span>
                              {m.fib.rec === "SHORT" && (<>
                                <span style={{ color: C.short }}>SHORT bis ~{fmtPrice(m.fib.swingLow)}</span>
                                <span className="mut">Invalidierung über {fmtPrice(m.fib.shortThreshold)} · ab {fmtPrice(m.fib.longThreshold)} LONG</span>
                              </>)}
                              {m.fib.rec === "LONG" && (<>
                                <span style={{ color: C.long }}>LONG bis ~{fmtPrice(m.fib.swingHigh)}</span>
                                <span className="mut">Invalidierung unter {fmtPrice(m.fib.longThreshold)} · ab {fmtPrice(m.fib.shortThreshold)} SHORT</span>
                              </>)}
                              {m.fib.rec === "NEUTRAL" && (<>
                                <span style={{ color: C.long }}>ab {fmtPrice(m.fib.longThreshold)} → LONG bis ~{fmtPrice(m.fib.swingHigh)}</span>
                                <span style={{ color: C.short }}>ab {fmtPrice(m.fib.shortThreshold)} → SHORT bis ~{fmtPrice(m.fib.swingLow)}</span>
                              </>)}
                              <span className="mut" style={{ color: C.gold }}>Golden Pocket {fmtPrice(m.fib.gpLow)} – {fmtPrice(m.fib.gpHigh)}</span>
                              {m.fib.nearest && (
                                <span className="mut">Nächste Marke: {m.fib.nearest.label} bei {fmtPrice(m.fib.nearest.price)}{m.fib.nearestPct != null ? ` (${m.fib.nearestPct.toFixed(1)} % entfernt)` : ""}</span>
                              )}
                              {(m.fib.above || m.fib.below) && (
                                <span className="mut">{m.fib.above ? `darüber ${m.fib.above.label} → ${fmtPrice(m.fib.above.price)}` : ""}{m.fib.above && m.fib.below ? " · " : ""}{m.fib.below ? `darunter ${m.fib.below.label} → ${fmtPrice(m.fib.below.price)}` : ""}</span>
                              )}
                            </div>
                            <div className="fibladder">
                              {m.fib.levels.filter((L) => L.r > 0 && L.r < 1).map((L) => (
                                <span key={L.r} className="fiblvl">{(L.r * 100).toFixed(1).replace(".0", "")}% · {fmtPrice(L.price)}</span>
                              ))}
                              {m.fib.ext.map((e) => (
                                <span key={"x" + e.r} className="fiblvl ext">Ext {(e.r * 100).toFixed(1).replace(".0", "")}% · {fmtPrice(e.price)}</span>
                              ))}
                            </div>
                          </div>
                        )}
                        {m.derivSrc === "Bybit" && (
                          <div className="posrow">
                            <div className="poslabel">Bollinger-Bänder (letzte 12 h)
                              <InfoTip text="Bollinger-Bänder aus dem 20-Perioden-Durchschnitt ± 2 Standardabweichungen, berechnet aus 5-Minuten-Kerzen über die letzten 12 Stunden. Der Chart zeigt das Band (grau), die Mittellinie (gold gestrichelt) und den Kursverlauf; die gestrichelte Linie markiert den aktuellen Preis. Position = wo der Kurs zwischen unterem (0 %) und oberem Band (100 %) steht. Bandbreite = Volatilität: enge Bänder (Squeeze) gehen oft größeren Bewegungen voraus. Aktualisiert ca. alle 60 Sekunden. Kurs-Niveaus, keine Empfehlung." />
                            </div>
                            {bbData[m.id]?.bb && bbData[m.id].bb.length > 1 ? (() => {
                              const arr = bbData[m.id].bb;
                              const last = arr[arr.length - 1];
                              const span = last.upper - last.lower;
                              const pctB = span > 0 ? (m.price - last.lower) / span : 0.5;
                              const width = last.mid > 0 ? span / last.mid : 0;
                              const col = pctB >= 0.5 ? C.long : C.short;
                              return (
                                <>
                                  <BollingerChart pts={arr} price={m.price} color={col} />
                                  <div className="posmoney">
                                    <span className="mut">Oberes Band {fmtPrice(last.upper)} · Mittel {fmtPrice(last.mid)} · Unteres Band {fmtPrice(last.lower)}</span>
                                    <span className="mut">Position {(pctB * 100).toFixed(0)} % im Band · Bandbreite {(width * 100).toFixed(0)} %</span>
                                  </div>
                                </>
                              );
                            })() : (
                              <div className="bbloading">Bollinger-Chart lädt …</div>
                            )}
                          </div>
                        )}
                        {m.derivSrc === "Bybit" && (
                          <div className="posrow">
                            <div className="poslabel">MACD (12, 26, 9) · letzte 12 h
                              <InfoTip text="MACD aus 5-Minuten-Kerzen: MACD-Linie (weiß) = EMA 12 minus EMA 26 des Schlusskurses, Signallinie (gold) = EMA 9 der MACD-Linie. Die Balken zeigen das Histogramm (MACD minus Signal): grün = MACD über Signal, rot = darunter; ein Vorzeichenwechsel (Kreuzung) ist das klassische MACD-Signal. Nulllinie = Trennlinie zwischen positivem und negativem Momentum. Aktualisiert ca. alle 60 Sekunden. Werte, keine Empfehlung." />
                            </div>
                            {bbData[m.id]?.macd && bbData[m.id].macd.length > 1 ? (() => {
                              const arr = bbData[m.id].macd;
                              const last = arr[arr.length - 1];
                              return (
                                <>
                                  <MacdChart pts={arr} />
                                  <div className="posmoney">
                                    <span className="mut">MACD {fmtPrice(last.macd)} · Signal {fmtPrice(last.signal)}</span>
                                    <span style={{ color: last.hist >= 0 ? C.long : C.short }}>Histogramm {fmtPrice(last.hist)} — MACD {last.hist >= 0 ? "über" : "unter"} Signal</span>
                                  </div>
                                </>
                              );
                            })() : (
                              <div className="bbloading">MACD-Chart lädt …</div>
                            )}
                          </div>
                        )}
                      </div>
                    )}
                    <ul className="factors">
                      {m.factors.map((f, i) => (
                        <li key={i}><span className="fdir" style={{ color: f.dir > 0.05 ? C.long : f.dir < -0.05 ? C.short : C.muted }}>
                          {f.dir > 0.05 ? "▲" : f.dir < -0.05 ? "▼" : "■"}</span>{f.label}{f.note ? ` — ${f.note}` : ""}</li>
                      ))}
                    </ul>
                  </>
                )}
              </article>
            ))}
          </div>
        </>
      )}

      {tab === "onchain" && (
        <>
          <div className="note">On-Chain-Momentum aus trending Dexscreener-Token. Nur Long-Seite. Achte auf die ⚠-Flags — genau diese Konstellation kennzeichnete den RAVE-Pump.</div>
          {status.dx === false && <div className="warn">Dexscreener nicht erreichbar.</div>}
          <div className="grid">
            {smalls.map((t) => (
              <article key={t.id} className="card">
                <div className="row1">
                  <div className="ident"><div className="chainchip">{t.chain}</div>
                    <div><div className="sym">{t.sym}</div><div className="nm">{t.name} · {ageStr(t.ageMs)} alt</div></div>
                  </div>
                  <div className="price">{fmtPrice(t.price)}</div>
                </div>
                <BiasGauge bias={t.bias} signal={t.signal === "LONG" ? "LONG" : "NEUTRAL"} />
                <div className="row2">
                  <SignalBadge signal={t.signal} confidence={t.confidence} />
                  <div className="quick"><span className={t.h24 >= 0 ? "up" : "dn"}>{fmtPct(t.h24)} 24h</span>
                    <span className="muted">Liq {fmtBig(t.liq)}</span><span className="muted">Vol {fmtBig(t.vol24)}</span></div>
                </div>
                {t.flags.length > 0 && (
                  <div className="flags">
                    {t.flags.map((f, i) => <span key={i} className="flag">⚠ {f}</span>)}
                    <InfoTip text="Warnzeichen für erhöhtes Risiko: 'Niedrige Liquidität' (unter ~$50k, leicht manipulierbar und schwer zu verlassen), 'Sehr neu' (unter 48h, unerprobt), 'Extremes Vol/Liq' (Volumen über 3× der Liquidität, typisch für Pumps), 'Hohe FDV/MCap' (großer Teil der Token noch nicht im Umlauf → Verwässerungsrisiko). Diese Konstellation kennzeichnete den RAVE-Pump." />
                  </div>
                )}
                <button className="why" onClick={() => toggle(t.id)}>{expanded.has(t.id) ? "Details ▴" : "Details ▾"}</button>
                {expanded.has(t.id) && (
                  <>
                    <div className="posbox">
                      <div className="posrow">
                        <div className="poslabel">Liquidität &amp; Aktivität
                          <InfoTip text="Liquidität = wie viel Kapital im Handelspool steckt; niedrig bedeutet leicht manipulierbar und schwer wieder herauszukommen. Vol/Liq = 24h-Volumen geteilt durch Liquidität; sehr hohe Werte deuten auf hektisches Hin- und Herhandeln (mögliche Wash-/Pump-Aktivität). FDV = Bewertung, wenn alle Token im Umlauf wären." />
                        </div>
                        <div className="posmoney">
                          <span className="mut">Liquidität {fmtBig(t.liq)}</span>
                          <span className="mut">24h-Volumen {fmtBig(t.vol24)}</span>
                          <span className="mut">Vol/Liq {t.vl != null ? t.vl.toFixed(1) + "×" : "—"}</span>
                          <span className="mut">Market Cap {fmtBig(t.mcap)} · FDV {fmtBig(t.fdv)}</span>
                        </div>
                      </div>
                    </div>
                    <ul className="factors">
                      {t.factors.map((f, i) => (
                        <li key={i}><span className="fdir" style={{ color: f.dir > 0.05 ? C.long : f.dir < -0.05 ? C.short : C.muted }}>
                          {f.dir > 0.05 ? "▲" : f.dir < -0.05 ? "▼" : "■"}</span>{f.label}</li>
                      ))}
                      {t.url && <li><a href={t.url} target="_blank" rel="noreferrer" className="dexlink">Auf Dexscreener öffnen ↗</a></li>}
                    </ul>
                  </>
                )}
              </article>
            ))}
          </div>
        </>
      )}

      {tab === "new" && (
        <>
          <div className="note">Neue &amp; angekündigte USDT-Perpetuals auf Bybit, sortiert nach Startzeitpunkt. „Bald handelbar" = noch nicht gestartet (Pre-Launch), „Frisch gelistet" = in den letzten 30 Tagen live gegangen.</div>
          {status.bybit === false && <div className="warn">Bybit nicht erreichbar — Listings nicht ladbar.</div>}

          <h3 className="sec">⏳ Bald handelbar ({listings.upcoming.length})
            <InfoTip text="Von Bybit angekündigte USDT-Perpetuals, deren Handel noch nicht gestartet ist (Pre-Launch). Der Countdown zeigt, wann der Markt live geht. Es werden ausschließlich Bybit-Listings angezeigt." />
          </h3>
          {listings.upcoming.length === 0 ? (
            <div className="empty">Aktuell keine angekündigten Pre-Launch-Märkte.</div>
          ) : (
            <div className="listgrid">
              {listings.upcoming.map((i) => (
                <div key={i.symbol} className="lcard up">
                  <div className="lsym">{i.base}<span className="lpair">{i.symbol}</span></div>
                  <div className="ltime"><span className="lin">in {fmtIn(i.t)}</span><span className="ldate">{fmtDate(i.t)}</span></div>
                </div>
              ))}
            </div>
          )}

          <h3 className="sec">🟢 Frisch gelistet ({listings.recent.length})
            <InfoTip text="USDT-Perpetuals, die in den letzten 30 Tagen auf Bybit live gegangen sind. Frische Listings sind häufig besonders volatil. Es werden ausschließlich Bybit-Listings angezeigt." />
          </h3>
          <div className="listgrid">
            {listings.recent.map((i) => (
              <div key={i.symbol} className="lcard">
                <div className="lsym">{i.base}<span className="lpair">{i.symbol}</span></div>
                <div className="ltime"><span className="lago">vor {fmtAgo(i.t)}</span><span className="ldate">{fmtDate(i.t)}</span></div>
              </div>
            ))}
          </div>
        </>
      )}

      <footer className="ftr">
        Modell: Trend (7d) · Momentum (24h/1h) · Funding &amp; Long/Short-Ratio (contrarian) → gewichteter Bias −100…+100.
        Funding/OI: Bybit (primär), Phemex (plausibilitätsgeprüft). Listings: Bybit. Markt: CoinGecko.
      </footer>
    </div>
  );
}
