name: update-data

on:
  schedule:
    - cron: '13,43 * * * *'   # alle 30 Min, aber auf krummen Minuten (weicht dem :00/:30-Ansturm aus)
  workflow_dispatch:           # plus a manual "Run workflow" button

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch keyless data
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/fetch-coins.mjs

      - name: Commit data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          git diff --quiet --cached || git commit -m "data update"
          git push
