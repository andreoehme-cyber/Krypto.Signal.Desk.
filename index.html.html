<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>SignalDesk - Krypto Long/Short</title>
<style>html,body,#root{margin:0;height:100%;background:#0B0F17;}</style>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useCallback, useRef } = React;

/* ============================================================================
   SIGNAL DESK — Live Krypto Long/Short Dashboard
   Datenquellen (öffentlich, ohne API-Key, CORS-fähig):
   - CoinGecko        Preise / Volumen / Market Cap / Momentum (Majors)
   - Binance Futures  Funding Rates (Contrarian-/Squeeze-Signal) für Majors
   - Dexscreener      On-Chain Momentum, Liquidität, neue Token (Small-Caps)

   Hinweis: Alle Signale sind algorithmische Heuristiken zur Einordnung,
   KEINE Anlageberatung. Krypto ist hochvolatil; Small-Caps bergen
   Totalverlust- und Pump-&-Dump-Risiko.
============================================================================ */

const C = {
  ink: "#0B0F17",
  panel: "#121826",
  panel2: "#0F1521",
  line: "#23314A",
  text: "#E7ECF5",
  muted: "#8A98B0",
  long: "#34D399",
  short: "#FF5C6C",
  neutral: "#6B86B0",
  gold: "#F2B23E",
};

const FONTS = `
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
`;

const CG_URL =
  "https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=40&page=1&price_change_percentage=1h%2C24h%2C7d&sparkline=false";
const BINANCE_FUNDING = "https://fapi.binance.com/fapi/v1/premiumIndex";
const DEX_BOOSTS = "https://api.dexscreener.com/token-boosts/top/v1";
const DEX_TOKENS = "https://api.dexscreener.com/latest/dex/tokens/";

/* ----------------------------- Formatierung ----------------------------- */
const fmtPrice = (p) => {
  if (p == null || isNaN(p)) return "—";
  if (p >= 1000) return "$" + Number(p).toLocaleString("en-US", { maximumFractionDigits: 0 });
  if (p >= 1) return "$" + p.toFixed(2);
  if (p >= 0.01) return "$" + p.toFixed(4);
  if (p >= 0.0001) return "$" + p.toFixed(6);
  return "$" + p.toExponential(2);
};
const fmtPct = (x) => (x == null || isNaN(x) ? "—" : (x >= 0 ? "+" : "") + x.toFixed(1) + "%");
const fmtBig = (n) => {
  if (n == null || isNaN(n)) return "—";
  return "$" + Intl.NumberFormat("en-US", { notation: "compact", maximumFractionDigits: 1 }).format(n);
};
const ageStr = (ms) => {
  if (!ms) return "—";
  const h = (Date.now() - ms) / 36e5;
  if (h < 48) return Math.max(1, Math.round(h)) + "h";
  return Math.round(h / 24) + "d";
};
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* ------------------------------- Scoring -------------------------------- */
// Majors: kombiniert Trend (7d), Momentum (24h/1h) und Funding (contrarian).
// Rückgabe: { bias:-100..100, signal, confidence, factors:[{label, dir}] }
function scoreMajor(m) {
  const c7 = m.c7, c24 = m.c24, c1 = m.c1, f = m.funding; // f: per 8h, dezimal
  const factors = [];

  const s7 = clamp((c7 ?? 0) / 25, -1, 1);
  if (c7 != null) factors.push({ label: `7-Tage-Trend ${fmtPct(c7)}`, dir: s7 });

  const s24 = clamp((c24 ?? 0) / 10, -1, 1);
  if (c24 != null) factors.push({ label: `24h-Momentum ${fmtPct(c24)}`, dir: s24 });

  const s1 = clamp((c1 ?? 0) / 5, -1, 1);

  let sF = 0;
  if (f != null) {
    sF = clamp(-f / 0.0005, -1, 1); // hohes positives Funding -> Short-Druck (überfüllte Longs)
    const ann = f * 3 * 365 * 100;
    factors.push({
      label: `Funding ${(f * 100).toFixed(3)}%/8h (≈${ann.toFixed(0)}%/Jahr)`,
      dir: sF,
      note: f > 0 ? "überfüllte Longs" : f < 0 ? "überfüllte Shorts" : "neutral",
    });
  } else {
    factors.push({ label: "Funding nicht verfügbar", dir: 0, note: "kein Futures-Markt" });
  }

  let raw = 0.35 * s7 + 0.3 * s24 + 0.25 * sF + 0.1 * s1;

  // Blow-off / Erschöpfung: parabolisch + überfüllte Longs -> Short-Neigung
  if ((c24 ?? 0) > 25 && (f ?? 0) > 0.0004) {
    raw -= 0.3;
    factors.push({ label: "Parabolisch + crowded Longs → Erschöpfungsrisiko", dir: -1 });
  }

  const volMcap = m.volume && m.mcap ? m.volume / m.mcap : null;
  if (volMcap != null)
    factors.push({ label: `Volumen/MCap ${(volMcap * 100).toFixed(0)}%`, dir: 0, note: volMcap > 0.15 ? "hohe Aktivität" : "ruhig" });

  const bias = clamp(raw, -1, 1) * 100;
  const signal = bias >= 35 ? "LONG" : bias <= -35 ? "SHORT" : "NEUTRAL";

  // Konfidenz: |bias| + Datenlage + Aktivität
  let conf = Math.abs(bias);
  if (f == null) conf = Math.min(conf, 55); // ohne Funding gedeckelt
  if (volMcap != null && volMcap > 0.15) conf += 8;
  const confidence = conf >= 60 ? "Hoch" : conf >= 35 ? "Mittel" : "Niedrig";

  return { bias, signal, confidence, factors };
}

// Small-Caps: nur Long-Momentum (kein sinnvoller Short auf DEX), mit Risiko-Flags.
function scoreSmall(t) {
  const factors = [];
  const h1 = t.h1, h6 = t.h6, h24 = t.h24;
  const s24 = clamp((h24 ?? 0) / 40, -1, 1);
  const s6 = clamp((h6 ?? 0) / 20, -1, 1);
  const s1 = clamp((h1 ?? 0) / 10, -1, 1);
  if (h24 != null) factors.push({ label: `24h ${fmtPct(h24)}`, dir: s24 });
  if (h6 != null) factors.push({ label: `6h ${fmtPct(h6)}`, dir: s6 });
  if (h1 != null) factors.push({ label: `1h ${fmtPct(h1)}`, dir: s1 });

  let raw = 0.5 * s24 + 0.3 * s6 + 0.2 * s1;

  const flags = [];
  if (t.liq != null && t.liq < 50000) flags.push("Niedrige Liquidität");
  if (t.ageMs && (Date.now() - t.ageMs) / 36e5 < 48) flags.push("Sehr neu");
  const vl = t.liq ? t.vol24 / t.liq : null;
  if (vl != null && vl > 3) flags.push("Extremes Vol/Liq");
  if (t.fdv && t.mcap && t.fdv > t.mcap * 5) flags.push("Hohe FDV/MCap");

  const bias = clamp(raw, 0, 1) * 100; // nur Long-Seite
  const signal = bias >= 40 ? "LONG" : bias >= 15 ? "BEOBACHTEN" : "FLAU";

  // Risiko senkt Konfidenz
  let conf = bias - flags.length * 18;
  const confidence = conf >= 55 ? "Hoch" : conf >= 30 ? "Mittel" : "Niedrig";

  return { bias, signal, confidence, factors, flags, vl };
}

/* ----------------------------- UI-Bausteine ----------------------------- */
function BiasGauge({ bias, signal }) {
  const pct = clamp((bias + 100) / 2, 0, 100); // 0..100, Short links, Long rechts
  const col = signal === "LONG" ? C.long : signal === "SHORT" ? C.short : C.neutral;
  return (
    <div className="gauge">
      <div className="gauge-track">
        <div className="gauge-half left" />
        <div className="gauge-half right" />
        <div className="gauge-center" />
        <div className="gauge-marker" style={{ left: `${pct}%`, background: col, boxShadow: `0 0 10px ${col}` }} />
      </div>
      <div className="gauge-labels">
        <span>SHORT</span>
        <span>NEUTRAL</span>
        <span>LONG</span>
      </div>
    </div>
  );
}

function SignalBadge({ signal, confidence }) {
  const map = {
    LONG: C.long, SHORT: C.short, NEUTRAL: C.neutral,
    BEOBACHTEN: C.gold, FLAU: C.muted,
  };
  const col = map[signal] || C.neutral;
  return (
    <div className="badge" style={{ color: col, borderColor: col + "66", background: col + "16" }}>
      <span className="badge-sig">{signal}</span>
      {confidence && <span className="badge-conf">{confidence}</span>}
    </div>
  );
}

function StatusDot({ ok }) {
  return <span className="dot" style={{ background: ok ? C.long : C.short, boxShadow: `0 0 6px ${ok ? C.long : C.short}` }} />;
}

/* ------------------------------- App ------------------------------------ */
function CryptoSignalDashboard() {
  const [tab, setTab] = useState("majors");
  const [majors, setMajors] = useState([]);
  const [smalls, setSmalls] = useState([]);
  const [status, setStatus] = useState({ cg: null, bn: null, dx: null });
  const [loading, setLoading] = useState(true);
  const [updated, setUpdated] = useState(null);
  const [sortKey, setSortKey] = useState("bias");
  const [expanded, setExpanded] = useState(() => new Set());
  const [auto, setAuto] = useState(true);
  const timer = useRef(null);

  const toggle = (id) =>
    setExpanded((prev) => {
      const n = new Set(prev);
      n.has(id) ? n.delete(id) : n.add(id);
      return n;
    });

  const loadMajors = useCallback(async () => {
    const [cg, bn] = await Promise.allSettled([
      fetch(CG_URL).then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); }),
      fetch(BINANCE_FUNDING).then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); }),
    ]);

    const fundMap = {};
    let bnOk = false;
    if (bn.status === "fulfilled" && Array.isArray(bn.value)) {
      bnOk = true;
      for (const it of bn.value) {
        if (it.symbol && it.symbol.endsWith("USDT")) {
          const base = it.symbol.slice(0, -4);
          fundMap[base] = parseFloat(it.lastFundingRate);
        }
      }
    }

    if (cg.status !== "fulfilled" || !Array.isArray(cg.value)) {
      setStatus((s) => ({ ...s, cg: false, bn: bnOk }));
      return;
    }
    const rows = cg.value.map((c) => {
      const sym = (c.symbol || "").toUpperCase();
      const m = {
        id: c.id,
        sym,
        name: c.name,
        img: c.image,
        rank: c.market_cap_rank,
        price: c.current_price,
        mcap: c.market_cap,
        volume: c.total_volume,
        c1: c.price_change_percentage_1h_in_currency,
        c24: c.price_change_percentage_24h_in_currency ?? c.price_change_percentage_24h,
        c7: c.price_change_percentage_7d_in_currency,
        funding: fundMap[sym] ?? fundMap["1000" + sym] ?? null,
      };
      return { ...m, ...scoreMajor(m) };
    });
    setMajors(rows);
    setStatus((s) => ({ ...s, cg: true, bn: bnOk }));
  }, []);

  const loadSmalls = useCallback(async () => {
    try {
      const boosts = await fetch(DEX_BOOSTS).then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); });
      const seen = new Set();
      const addrs = [];
      for (const b of boosts || []) {
        if (b.tokenAddress && !seen.has(b.tokenAddress) && addrs.length < 28) {
          seen.add(b.tokenAddress);
          addrs.push(b.tokenAddress);
        }
      }
      if (!addrs.length) { setStatus((s) => ({ ...s, dx: false })); return; }

      const data = await fetch(DEX_TOKENS + addrs.join(",")).then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); });
      const byTok = {};
      for (const p of data.pairs || []) {
        const a = p.baseToken?.address;
        if (!a) continue;
        const liq = p.liquidity?.usd ?? 0;
        if (!byTok[a] || liq > (byTok[a].liquidity?.usd ?? 0)) byTok[a] = p;
      }
      let rows = Object.values(byTok).map((p) => {
        const t = {
          id: p.pairAddress,
          sym: (p.baseToken?.symbol || "?").toUpperCase(),
          name: p.baseToken?.name || "",
          chain: p.chainId,
          dex: p.dexId,
          url: p.url,
          price: parseFloat(p.priceUsd),
          liq: p.liquidity?.usd ?? null,
          vol24: p.volume?.h24 ?? null,
          mcap: p.marketCap ?? null,
          fdv: p.fdv ?? null,
          ageMs: p.pairCreatedAt ?? null,
          h1: p.priceChange?.h1 ?? null,
          h6: p.priceChange?.h6 ?? null,
          h24: p.priceChange?.h24 ?? null,
        };
        return { ...t, ...scoreSmall(t) };
      });
      rows = rows.filter((r) => r.liq && r.liq > 5000).sort((a, b) => b.bias - a.bias).slice(0, 18);
      setSmalls(rows);
      setStatus((s) => ({ ...s, dx: true }));
    } catch (e) {
      setStatus((s) => ({ ...s, dx: false }));
    }
  }, []);

  const refresh = useCallback(async () => {
    setLoading(true);
    await Promise.allSettled([loadMajors(), loadSmalls()]);
    setUpdated(new Date());
    setLoading(false);
  }, [loadMajors, loadSmalls]);

  useEffect(() => { refresh(); }, [refresh]);
  useEffect(() => {
    if (auto) {
      timer.current = setInterval(refresh, 60000);
      return () => clearInterval(timer.current);
    }
  }, [auto, refresh]);

  const sortedMajors = [...majors].sort((a, b) => {
    if (sortKey === "bias") return b.bias - a.bias;
    if (sortKey === "c24") return (b.c24 ?? -999) - (a.c24 ?? -999);
    if (sortKey === "funding") return (b.funding ?? 0) - (a.funding ?? 0);
    if (sortKey === "rank") return (a.rank ?? 999) - (b.rank ?? 999);
    return 0;
  });

  return (
    <div className="root">
      <style>{FONTS + CSS}</style>

      <header className="hdr">
        <div className="brand">
          <div className="mark">◧</div>
          <div>
            <h1>SIGNAL<span>DESK</span></h1>
            <p className="tag">Live Long/Short-Signale · Majors &amp; On-Chain</p>
          </div>
        </div>
        <div className="ctrls">
          <div className="sources">
            <span><StatusDot ok={status.cg} />CoinGecko</span>
            <span><StatusDot ok={status.bn} />Binance</span>
            <span><StatusDot ok={status.dx} />Dexscreener</span>
          </div>
          <button className={"auto " + (auto ? "on" : "")} onClick={() => setAuto((a) => !a)}>
            Auto 60s {auto ? "AN" : "AUS"}
          </button>
          <button className="refresh" onClick={refresh} disabled={loading}>
            {loading ? "lädt…" : "↻ Aktualisieren"}
          </button>
        </div>
      </header>

      <div className="disclaimer">
        Keine Anlageberatung. Signale sind transparente, algorithmische Heuristiken zur Einordnung — keine Kauf-/Verkaufsempfehlungen.
        Krypto ist hochvolatil; Small-Caps bergen Totalverlust- und Pump-&amp;-Dump-Risiko (siehe RAVE 04/2026).
      </div>

      <nav className="tabs">
        <button className={tab === "majors" ? "act" : ""} onClick={() => setTab("majors")}>
          Majors <em>{majors.length}</em>
        </button>
        <button className={tab === "onchain" ? "act" : ""} onClick={() => setTab("onchain")}>
          On-Chain / Small-Caps <em>{smalls.length}</em>
        </button>
        <span className="upd">{updated ? "Stand " + updated.toLocaleTimeString("de-DE") : ""}</span>
      </nav>

      {tab === "majors" && (
        <>
          <div className="sortbar">
            Sortieren:
            {[["bias", "Signal-Stärke"], ["c24", "24h"], ["funding", "Funding"], ["rank", "Market Cap"]].map(([k, l]) => (
              <button key={k} className={sortKey === k ? "act" : ""} onClick={() => setSortKey(k)}>{l}</button>
            ))}
          </div>
          {status.bn === false && (
            <div className="warn">Binance-Funding aktuell nicht erreichbar — Signale laufen ohne Derivate-Daten (Konfidenz gedeckelt). Ggf. Netzwerk/Region prüfen.</div>
          )}
          {status.cg === false && <div className="warn">CoinGecko nicht erreichbar — keine Major-Daten ladbar.</div>}
          <div className="grid">
            {sortedMajors.map((m) => (
              <article key={m.id} className="card">
                <div className="row1">
                  <div className="ident">
                    {m.img && <img src={m.img} alt="" />}
                    <div>
                      <div className="sym">{m.sym}<span className="rnk">#{m.rank}</span></div>
                      <div className="nm">{m.name}</div>
                    </div>
                  </div>
                  <div className="price">{fmtPrice(m.price)}</div>
                </div>

                <BiasGauge bias={m.bias} signal={m.signal} />
                <div className="row2">
                  <SignalBadge signal={m.signal} confidence={m.confidence} />
                  <div className="quick">
                    <span className={m.c24 >= 0 ? "up" : "dn"}>{fmtPct(m.c24)} 24h</span>
                    <span className={m.c7 >= 0 ? "up" : "dn"}>{fmtPct(m.c7)} 7d</span>
                    {m.funding != null && (
                      <span className={m.funding >= 0 ? "fp" : "fn"}>Fund {(m.funding * 100).toFixed(3)}%</span>
                    )}
                  </div>
                </div>

                <button className="why" onClick={() => toggle(m.id)}>
                  {expanded.has(m.id) ? "Warum? ▴" : "Warum? ▾"}
                </button>
                {expanded.has(m.id) && (
                  <ul className="factors">
                    {m.factors.map((f, i) => (
                      <li key={i}>
                        <span className="fdir" style={{ color: f.dir > 0.05 ? C.long : f.dir < -0.05 ? C.short : C.muted }}>
                          {f.dir > 0.05 ? "▲" : f.dir < -0.05 ? "▼" : "■"}
                        </span>
                        {f.label}{f.note ? ` — ${f.note}` : ""}
                      </li>
                    ))}
                  </ul>
                )}
              </article>
            ))}
          </div>
        </>
      )}

      {tab === "onchain" && (
        <>
          <div className="note">
            On-Chain-Momentum aus aktuell „geboosteten"/trending Dexscreener-Token. Nur Long-Seite (kein sinnvoller DEX-Short).
            Achte auf die Risiko-Flags — genau diese Konstellation (niedrige Liquidität, sehr neu, extremes Volumen) kennzeichnete den RAVE-Pump.
          </div>
          {status.dx === false && <div className="warn">Dexscreener nicht erreichbar — On-Chain-Daten momentan nicht ladbar.</div>}
          <div className="grid">
            {smalls.map((t) => (
              <article key={t.id} className="card">
                <div className="row1">
                  <div className="ident">
                    <div className="chainchip">{t.chain}</div>
                    <div>
                      <div className="sym">{t.sym}</div>
                      <div className="nm">{t.name} · {ageStr(t.ageMs)} alt</div>
                    </div>
                  </div>
                  <div className="price">{fmtPrice(t.price)}</div>
                </div>

                <BiasGauge bias={t.bias - 0} signal={t.signal === "LONG" ? "LONG" : t.signal === "BEOBACHTEN" ? "NEUTRAL" : "NEUTRAL"} />
                <div className="row2">
                  <SignalBadge signal={t.signal} confidence={t.confidence} />
                  <div className="quick">
                    <span className={t.h24 >= 0 ? "up" : "dn"}>{fmtPct(t.h24)} 24h</span>
                    <span className="muted">Liq {fmtBig(t.liq)}</span>
                    <span className="muted">Vol {fmtBig(t.vol24)}</span>
                  </div>
                </div>

                {t.flags.length > 0 && (
                  <div className="flags">
                    {t.flags.map((f, i) => <span key={i} className="flag">⚠ {f}</span>)}
                  </div>
                )}

                <button className="why" onClick={() => toggle(t.id)}>
                  {expanded.has(t.id) ? "Details ▴" : "Details ▾"}
                </button>
                {expanded.has(t.id) && (
                  <ul className="factors">
                    {t.factors.map((f, i) => (
                      <li key={i}>
                        <span className="fdir" style={{ color: f.dir > 0.05 ? C.long : f.dir < -0.05 ? C.short : C.muted }}>
                          {f.dir > 0.05 ? "▲" : f.dir < -0.05 ? "▼" : "■"}
                        </span>{f.label}
                      </li>
                    ))}
                    <li><span className="fdir" style={{ color: C.muted }}>■</span>Vol/Liq {t.vl != null ? t.vl.toFixed(1) + "×" : "—"} · MCap {fmtBig(t.mcap)}</li>
                    {t.url && <li><a href={t.url} target="_blank" rel="noreferrer" className="dexlink">Auf Dexscreener öffnen ↗</a></li>}
                  </ul>
                )}
              </article>
            ))}
          </div>
        </>
      )}

      <footer className="ftr">
        Modell: Trend (7d) · Momentum (24h/1h) · Funding (contrarian/Squeeze) → gewichteter Bias −100…+100.
        Erweiterbar um Open Interest, Long/Short-Ratio, Liquidations-Heatmap & Social-Velocity.
      </footer>
    </div>
  );
}

/* -------------------------------- Styles -------------------------------- */
const CSS = `
.root{background:${C.ink};min-height:100vh;color:${C.text};font-family:'Space Grotesk',system-ui,sans-serif;padding:18px;box-sizing:border-box;}
.root *{box-sizing:border-box;}
.hdr{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;}
.brand{display:flex;gap:12px;align-items:center;}
.mark{width:42px;height:42px;border:1.5px solid ${C.gold};color:${C.gold};border-radius:9px;display:grid;place-items:center;font-size:22px;}
.brand h1{font-size:22px;font-weight:700;letter-spacing:1px;margin:0;line-height:1;}
.brand h1 span{color:${C.gold};}
.tag{margin:4px 0 0;color:${C.muted};font-size:12px;letter-spacing:.3px;}
.ctrls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.sources{display:flex;gap:12px;font-family:'IBM Plex Mono',monospace;font-size:11px;color:${C.muted};}
.sources span{display:flex;align-items:center;gap:5px;}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
.auto,.refresh{font-family:'IBM Plex Mono',monospace;font-size:12px;border-radius:7px;padding:8px 12px;cursor:pointer;border:1px solid ${C.line};background:${C.panel};color:${C.text};}
.auto.on{border-color:${C.long}66;color:${C.long};}
.refresh{background:${C.gold};color:#1a1304;border-color:${C.gold};font-weight:600;}
.refresh:disabled{opacity:.6;cursor:wait;}
.disclaimer{margin:14px 0 0;font-size:11.5px;line-height:1.5;color:${C.muted};border-left:2px solid ${C.gold};padding:8px 12px;background:${C.panel2};border-radius:0 8px 8px 0;}
.tabs{display:flex;gap:8px;align-items:center;margin:16px 0 4px;border-bottom:1px solid ${C.line};}
.tabs button{background:none;border:none;color:${C.muted};font-family:'Space Grotesk';font-size:14px;font-weight:600;padding:10px 4px;margin-right:14px;cursor:pointer;border-bottom:2px solid transparent;}
.tabs button.act{color:${C.text};border-bottom-color:${C.gold};}
.tabs button em{font-style:normal;font-family:'IBM Plex Mono';font-size:11px;color:${C.muted};margin-left:5px;}
.upd{margin-left:auto;font-family:'IBM Plex Mono';font-size:11px;color:${C.muted};}
.sortbar{display:flex;gap:6px;align-items:center;font-size:12px;color:${C.muted};margin:14px 0;flex-wrap:wrap;font-family:'IBM Plex Mono';}
.sortbar button{background:${C.panel};border:1px solid ${C.line};color:${C.muted};border-radius:6px;padding:5px 9px;cursor:pointer;font-size:11px;}
.sortbar button.act{color:${C.gold};border-color:${C.gold}66;}
.note,.warn{font-size:12px;line-height:1.5;border-radius:8px;padding:10px 12px;margin:12px 0;}
.note{color:${C.muted};background:${C.panel2};border:1px solid ${C.line};}
.warn{color:${C.short};background:${C.short}12;border:1px solid ${C.short}44;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;margin-top:8px;}
.card{background:${C.panel};border:1px solid ${C.line};border-radius:12px;padding:14px;}
.row1{display:flex;justify-content:space-between;align-items:center;gap:8px;}
.ident{display:flex;gap:10px;align-items:center;min-width:0;}
.ident img{width:30px;height:30px;border-radius:50%;}
.chainchip{font-family:'IBM Plex Mono';font-size:9px;text-transform:uppercase;border:1px solid ${C.line};border-radius:5px;padding:4px 6px;color:${C.muted};}
.sym{font-weight:700;font-size:15px;display:flex;align-items:baseline;gap:6px;}
.rnk{font-family:'IBM Plex Mono';font-size:10px;color:${C.muted};font-weight:400;}
.nm{font-size:11px;color:${C.muted};white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px;}
.price{font-family:'IBM Plex Mono';font-size:15px;font-weight:600;}
.gauge{margin:14px 0 8px;}
.gauge-track{position:relative;height:8px;border-radius:5px;overflow:visible;display:flex;}
.gauge-half{flex:1;height:100%;}
.gauge-half.left{background:linear-gradient(90deg,${C.short}55,${C.short}11);border-radius:5px 0 0 5px;}
.gauge-half.right{background:linear-gradient(90deg,${C.long}11,${C.long}55);border-radius:0 5px 5px 0;}
.gauge-center{position:absolute;left:50%;top:-3px;width:1px;height:14px;background:${C.muted}66;}
.gauge-marker{position:absolute;top:-3px;width:4px;height:14px;border-radius:3px;transform:translateX(-50%);transition:left .4s ease;}
.gauge-labels{display:flex;justify-content:space-between;font-family:'IBM Plex Mono';font-size:9px;color:${C.muted};margin-top:5px;letter-spacing:.5px;}
.row2{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:6px;flex-wrap:wrap;}
.badge{display:inline-flex;align-items:center;gap:6px;border:1px solid;border-radius:7px;padding:5px 9px;}
.badge-sig{font-weight:700;font-size:12px;letter-spacing:1px;}
.badge-conf{font-family:'IBM Plex Mono';font-size:9px;opacity:.8;border-left:1px solid currentColor;padding-left:6px;}
.quick{display:flex;gap:10px;font-family:'IBM Plex Mono';font-size:11px;flex-wrap:wrap;justify-content:flex-end;}
.quick .up{color:${C.long};}.quick .dn{color:${C.short};}
.quick .fp{color:${C.short};}.quick .fn{color:${C.long};}
.quick .muted{color:${C.muted};}
.why{margin-top:10px;background:none;border:none;color:${C.muted};font-family:'IBM Plex Mono';font-size:11px;cursor:pointer;padding:0;}
.factors{list-style:none;margin:8px 0 0;padding:8px 0 0;border-top:1px dashed ${C.line};font-size:12px;line-height:1.7;color:${C.text};}
.factors li{display:flex;gap:7px;}
.fdir{font-size:9px;line-height:1.7;}
.flags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;}
.flag{font-family:'IBM Plex Mono';font-size:10px;color:${C.gold};border:1px solid ${C.gold}44;background:${C.gold}12;border-radius:5px;padding:3px 7px;}
.dexlink{color:${C.gold};text-decoration:none;}
.ftr{margin-top:22px;padding-top:14px;border-top:1px solid ${C.line};font-size:11px;color:${C.muted};line-height:1.6;font-family:'IBM Plex Mono';}
@media (max-width:560px){.hdr{flex-direction:column;}.ctrls{width:100%;}.grid{grid-template-columns:1fr;}}
`;


ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(CryptoSignalDashboard));
</script>
</body>
</html>
